name: Sync Plugin Registry

on:
  push:
    paths:
      - ".obsidian/community-plugins.json"
      - ".obsidian/core-plugins.json"
      - ".obsidian/plugins/*/manifest.json"
      - "manifest.json"
      - "swarm.json"

jobs:
  check-plugin-registry:
    name: Verify plugin registry blocks are current
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install locked project environment
        run: uv sync --locked

      - name: Check plugin registry is in sync
        run: uv run python .github/scripts/sync_obsidian_plugin_registry.py --check
