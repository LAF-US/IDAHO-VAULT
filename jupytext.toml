# Jupytext configuration — the "middle" that marries machine (Python) and plaintext (Markdown).
#
# Pairing is EXPLICIT and per-notebook (opt-in), NOT global — this is deliberate.
# A global `default_jupytext_formats` would auto-pair every notebook to a same-named .md and
# let an *existing, stale* .md overwrite a notebook's code on `--sync` (the direction is
# mtime-dependent). That footgun already cost a notebook's code once. So each notebook opts in:
#
#     jupytext --set-formats ipynb,md path/to/Notebook.ipynb   # one time, pairs it
#     jupytext --sync          path/to/Notebook.ipynb          # thereafter, keep the pair honest
#
# NEVER run --set-formats on a notebook that already has a same-named .md you care about; check
# the .md first. See NOTEBOOKS.md for the full convention.
#
# (Intentionally no global pairing default — pairing lives in each notebook's own metadata.)

# This setting keeps the writing tool's own version out of the twin.
#
# jupytext stamps `jupytext.text_representation.jupytext_version` into every twin it
# writes. That value is not a compatibility key — `format_version` is the one jupytext
# gates on when deciding whether a file is safe to read. The stamp exists only so an
# error message can name a version to install.
#
# Recorded inside the file, it changes every time the tool is upgraded, so the paired
# check reports elapsed time as content drift, and CI has to pin an exact version to
# avoid rewriting it. That pin is what breaks when a lockfile stops carrying jupytext.
# Filtering the stamp removes the coupling: any jupytext version writes the same bytes.
#
# Config-level so a *newly* paired notebook inherits it without anyone remembering.
# It is not a pairing default and does not reintroduce the --sync footgun above.
notebook_metadata_filter = "-jupytext.text_representation.jupytext_version"
