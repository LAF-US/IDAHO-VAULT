name: Python Test Suite

# Runs tests/ (pytest) in CI. Before this workflow, no automation in
# this repo ever installed the pyproject.toml/uv.lock dependency set (pydantic,
# pytest, crewai, ...) or executed tests/*.py at all -- every other checker
# workflow runs a single stdlib-only script directly, and "full test suite
# passes" in PR bodies was a self-reported, never-re-verified claim. This job
# closes that gap: build the environment the repo's own run-idaho-vault skill
# documents (uv sync against pyproject.toml/uv.lock), then run the suite for
# real. Not yet added to branch protection required checks -- same as every
# other policy workflow here, that promotion is a separate repo-admin decision.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

      - name: uv sync (installs pyproject + dev group per uv.lock)
        run: uv sync

      - name: Run test suite
        run: uv run pytest tests -v
