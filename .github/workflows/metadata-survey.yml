name: Metadata Survey

# Scheduled scan of markdown frontmatter health against VAULT-METADATA-STANDARD.
# Advances issue #252 (metadata/frontmatter standardization debt and schema enforcement)
# per the doctrine plan at !/ARBORSCAPE-PR-EXPANSION-2026-05-22.md (Phase 1d).
# Runs the existing metadata_survey.py scanner (no Python authored here) and syncs
# a recurring issue via issue_reconciler.py, matching the branch-garden-report pattern.

on:
  schedule:
    - cron: '0 10 * * 1'   # Mon 10:00 UTC, matching Branch Garden cadence
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run metadata survey
        id: survey
        run: |
          python .github/scripts/metadata_survey.py \
            --format markdown \
            --output metadata-survey-report.md
          # metadata_survey.py does not emit has_findings; metadata debt is structurally
          # always present per issue #252 ("not a demand to retrofit the entire historical
          # corpus in one pass"). Treat the report as a persistent visibility surface.
          echo "has_findings=true" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        run: cat metadata-survey-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Sync recurring issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/issue_reconciler.py \
            --title "[Metadata Survey] Weekly report" \
            --body-file metadata-survey-report.md \
            --has-findings "${{ steps.survey.outputs.has_findings }}" \
            --resolved-comment "Resolved automatically: the latest metadata survey found no debt."
