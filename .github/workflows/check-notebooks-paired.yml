name: check-notebooks-paired

# The "middle" guardrail: every explicitly-paired Jupyter notebook must stay in sync with its
# Markdown twin. Mirrors the repo's other check-* workflows. Installs jupytext at the exact
# version uv.lock pins (the single source of truth), so the runner matches the version that
# wrote the committed twins and can't rewrite their stamp. Actions are pinned to full SHAs
# per repo policy.

on:
  pull_request:
    paths:
      - "**/*.ipynb"
      - "**/*.md"
      - "jupytext.toml"
      # Re-validate the guardrail when the guardrail itself changes, so edits to the
      # enforcement script or this workflow can't land without running the check they implement.
      - ".github/scripts/jupytext_sync_paired.py"
      - ".github/workflows/check-notebooks-paired.yml"
  workflow_dispatch:

permissions:
  contents: read

# Supersede, don't stack. This workflow runs on pull_request and workflow_dispatch
# only — no push, no merge_group — so the group key is just the ref, and a newer run
# for the same PR replaces an older one. A PR run scans the notebook set as it stands,
# not a delta, so nothing is lost by superseding.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  paired:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install jupytext
        run: |
          # No version pin, on purpose. The pin existed because the twins recorded the
          # jupytext version that wrote them, so a different version on the runner
          # rewrote that line and the drift check below called it content drift. The
          # twins no longer record it — `notebook_metadata_filter` in jupytext.toml and
          # in each paired notebook drops the stamp — so any version writes the same
          # bytes. Measured across 1.18.1 and 1.19.5: byte-identical with the filter,
          # and the stamp rewritten without it.
          #
          # The pin also read that version out of uv.lock with `next(...)` and no
          # default. When uv.lock stopped carrying jupytext, that raised a bare
          # StopIteration and took every PR touching **/*.md or **/*.ipynb red. A check
          # about notebook pairing should not fail on the contents of a lockfile.
          #
          # Real drift is still caught: `format_version` — the field jupytext actually
          # gates compatibility on — is not filtered, so a genuine format change fails
          # the job as it should.
          python -m pip install --quiet jupytext
          python -c "import jupytext; print('jupytext', jupytext.__version__)"
      - name: Sync every paired notebook and fail on drift
        run: |
          # Sync ONLY notebooks that declare a pairing (explicit opt-in). A sync error on a
          # paired notebook fails the job — no more silent '|| true' that could pass green while
          # a paired notebook failed to sync. Unpaired or unparseable (corrupt) notebooks are
          # skipped, never synced. The helper's stdout is its strict list of declared, existing
          # twin paths; scope the drift test to that list so unrelated checkout state (including
          # an unhydrated LFS archive) cannot masquerade as a notebook-pair failure.
          twins_file="$(mktemp)"
          python .github/scripts/jupytext_sync_paired.py > "$twins_file"
          mapfile -t paired_twins < "$twins_file"
          rm -f -- "$twins_file"
          paired_status=""
          if ((${#paired_twins[@]})); then
            paired_status="$(git status --short --untracked-files=all --ignored -- "${paired_twins[@]}")"
          fi
          if ((${#paired_twins[@]})) && {
            ! git diff --quiet -- "${paired_twins[@]}" || [[ -n "$paired_status" ]]
          }; then
            echo "::error::A notebook twin is out of sync or untracked. Run 'jupytext --sync <notebook>' and commit the twin."
            git --no-pager diff --stat -- "${paired_twins[@]}"
            if [[ -n "$paired_status" ]]; then
              printf '%s\n' "$paired_status"
            fi
            exit 1
          fi
