name: check-notebooks-paired

# The "middle" guardrail: every explicitly-paired Jupyter notebook must stay in sync with its
# Markdown twin. Mirrors the repo's other check-* workflows. Installs jupytext directly (so it
# does not depend on requirements.txt carrying the dev tool). Actions are pinned to full SHAs
# per repo policy.

on:
  pull_request:
    paths:
      - "**/*.ipynb"
      - "**/*.md"
      - "jupytext.toml"
      # Re-validate the guardrail when the guardrail itself changes, so edits to the
      # enforcement script or this workflow can't land without running the check they implement.
      - ".github/scripts/jupytext_sync_paired.py"
      - ".github/workflows/check-notebooks-paired.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install jupytext
        run: python -m pip install --quiet "jupytext>=1.16,<2"
      - name: Sync every paired notebook and fail on drift
        run: |
          # Sync ONLY notebooks that declare a pairing (explicit opt-in). A sync error on a
          # paired notebook fails the job — no more silent '|| true' that could pass green while
          # a paired notebook failed to sync. Unpaired or unparseable (corrupt) notebooks are
          # skipped, never synced. Then any drift against a committed twin fails the job.
          python .github/scripts/jupytext_sync_paired.py
          if ! git diff --quiet; then
            echo "::error::A notebook twin is out of sync. Run 'jupytext --sync <notebook>' and commit the twin."
            git --no-pager diff --stat
            exit 1
          fi
