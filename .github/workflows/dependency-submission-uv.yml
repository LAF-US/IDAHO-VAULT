name: Dependency Submission — uv

# Submits the resolved dependency graph from uv.lock to GitHub's Dependency
# Submission API, replacing GitHub's built-in "Automatic Dependency Submission
# (Python)".
#
# WHY: this project is resolved by uv, whose universal lock pins some packages
# at two versions (e.g. numpy 2.2.6 for python<3.11 AND 2.4.6 for python>=3.11).
# GitHub's built-in auto-submission re-resolves from scratch with the
# `component-detection` engine (pip's resolver underneath) and dies with
# `ResolutionImpossible` on every run — the constantly-red `submit-pypi` check.
# This workflow reads the already-resolved uv.lock instead (no re-resolution),
# so the graph submits cleanly. See .github/scripts/uv_dependency_submission.py.
#
# ACTION REQUIRED BY MAINTAINER (one-time, repo setting, not in this file):
# set Settings -> Code security -> "Automatic dependency submission" to
# **Disabled** so the failing built-in component-detection job stops running.
# ("Enabled for labeled runners" is NOT a fix — it runs the same engine on a
# self-hosted runner and still hits ResolutionImpossible.)
#
# No secrets: uses the built-in GITHUB_TOKEN with contents: write (the scope the
# Dependency Submission API requires). Runs post-merge on main only.

on:
  push:
    branches: [main]
    paths:
      - "**/uv.lock"
      - "**/pyproject.toml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-uv-dependencies:
    name: Submit uv dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required to submit dependency-graph snapshots
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build dependency snapshot from uv.lock
        run: python .github/scripts/uv_dependency_submission.py > snapshot.json

      - name: Submit snapshot to the dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input snapshot.json
