name: Agent Swarm Signing Proof

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Per-agent GitHub App lane to test"
        required: true
        default: "opencode"
        type: choice
        options:
          - opencode
          - claude
          - mistral
          - codex

permissions:
  contents: read
  issues: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Main Ruleset still requires signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rulesets="$(gh api "repos/$REPO/rulesets" --jq '.[] | select(.name=="Main Ruleset") | .id')"
          if [ -z "$rulesets" ]; then
            echo "Main Ruleset was not found." >&2
            exit 1
          fi
          matched="false"
          while IFS= read -r ruleset_id; do
            if gh api "repos/$REPO/rulesets/$ruleset_id" --jq '.rules[].type' | grep -qx 'required_signatures'; then
              matched="true"
              break
            fi
          done <<< "$rulesets"
          if [ "$matched" != "true" ]; then
            echo "Main Ruleset does not currently include required_signatures." >&2
            exit 1
          fi

      - name: Mint opencode App token
        if: ${{ github.event.inputs.agent == 'opencode' }}
        id: token_opencode
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.OPENCODE_AGENT_APP_ID }}
          private-key: ${{ secrets.OPENCODE_AGENT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Mint Claude App token
        if: ${{ github.event.inputs.agent == 'claude' }}
        id: token_claude
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Mint Mistral App token
        if: ${{ github.event.inputs.agent == 'mistral' }}
        id: token_mistral
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MISTRAL_APP_ID }}
          private-key: ${{ secrets.MISTRAL_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Mint Codex App token
        if: ${{ github.event.inputs.agent == 'codex' }}
        id: token_codex
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Select App token
        id: app
        env:
          AGENT: ${{ github.event.inputs.agent }}
          OPENCODE_TOKEN: ${{ steps.token_opencode.outputs.token }}
          OPENCODE_SLUG: ${{ steps.token_opencode.outputs.app-slug }}
          OPENCODE_INSTALLATION: ${{ steps.token_opencode.outputs.installation-id }}
          CLAUDE_TOKEN: ${{ steps.token_claude.outputs.token }}
          CLAUDE_SLUG: ${{ steps.token_claude.outputs.app-slug }}
          CLAUDE_INSTALLATION: ${{ steps.token_claude.outputs.installation-id }}
          MISTRAL_TOKEN: ${{ steps.token_mistral.outputs.token }}
          MISTRAL_SLUG: ${{ steps.token_mistral.outputs.app-slug }}
          MISTRAL_INSTALLATION: ${{ steps.token_mistral.outputs.installation-id }}
          CODEX_TOKEN: ${{ steps.token_codex.outputs.token }}
          CODEX_SLUG: ${{ steps.token_codex.outputs.app-slug }}
          CODEX_INSTALLATION: ${{ steps.token_codex.outputs.installation-id }}
        run: |
          set -euo pipefail
          case "$AGENT" in
            opencode)
              token="$OPENCODE_TOKEN"
              slug="$OPENCODE_SLUG"
              installation="$OPENCODE_INSTALLATION"
              ;;
            claude)
              token="$CLAUDE_TOKEN"
              slug="$CLAUDE_SLUG"
              installation="$CLAUDE_INSTALLATION"
              ;;
            mistral)
              token="$MISTRAL_TOKEN"
              slug="$MISTRAL_SLUG"
              installation="$MISTRAL_INSTALLATION"
              ;;
            codex)
              token="$CODEX_TOKEN"
              slug="$CODEX_SLUG"
              installation="$CODEX_INSTALLATION"
              ;;
            *)
              echo "Unsupported agent: $AGENT" >&2
              exit 1
              ;;
          esac
          if [ -z "$token" ] || [ -z "$slug" ] || [ -z "$installation" ]; then
            echo "Selected App credential did not produce a usable token, slug, and installation id." >&2
            exit 1
          fi
          {
            echo "APP_TOKEN=$token"
            echo "APP_SLUG=$slug"
            echo "INSTALLATION_ID=$installation"
          } >> "$GITHUB_ENV"
          {
            echo "slug=$slug"
            echo "installation=$installation"
          } >> "$GITHUB_OUTPUT"

      - name: Create proof commit through selected App
        id: proof
        env:
          REPO: ${{ github.repository }}
          AGENT: ${{ github.event.inputs.agent }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$APP_TOKEN"
          branch="agent/signing-proof-${AGENT}"
          proof_path="!/SIGNING-GATE-PROOF-${AGENT^^}.md"
          main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            branch_action="reused"
          else
            gh api "repos/$REPO/git/refs" \
              --method POST \
              -f ref="refs/heads/$branch" \
              -f sha="$main_sha" >/dev/null
            branch_action="created"
          fi
          cat > proof.md <<EOF
          # Signing Gate Proof - ${AGENT}

          This file is a controlled proof artifact for issue #398.

          - Agent lane: ${AGENT}
          - GitHub App slug: ${APP_SLUG}
          - App installation id: ${INSTALLATION_ID}
          - Source evidence PR: #408
          - Source evidence SHA: 067cdc0a141d995624ac9769592e5428e371f3a3
          - Expected verifier: ${APP_SLUG}[bot], verified by GitHub for this App-authenticated API commit
          - Constraint: this commit was created through the GitHub REST API with no custom author, committer, or signature fields.

          This PR is a signing-gate test vehicle, not a merge objective for unrelated payload.
          EOF
          encoded_content="$(base64 -w 0 proof.md)"
          existing_json="$(gh api "repos/$REPO/contents/$proof_path?ref=$branch" 2>/dev/null || true)"
          existing_sha=""
          if [ -n "$existing_json" ]; then
            existing_sha="$(jq -r '.sha' <<< "$existing_json")"
          fi
          put_args=(
            "repos/$REPO/contents/$proof_path"
            --method PUT \
            -f message="proof(signing): ${AGENT} App landing verification" \
            -f content="$encoded_content" \
            -f branch="$branch"
          )
          if [ -n "$existing_json" ] &&
             jq -r '.content' <<< "$existing_json" | base64 -d | cmp -s - proof.md; then
            file_action="noop"
            commit_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          else
            if [ -n "$existing_sha" ]; then
              put_args+=(-f sha="$existing_sha")
              file_action="updated"
            else
              file_action="created"
            fi
            response="$(gh api "${put_args[@]}")"
            commit_sha="$(echo "$response" | jq -r '.commit.sha')"
          fi
          {
            echo "branch=$branch"
            echo "proof_path=$proof_path"
            echo "commit_sha=$commit_sha"
            echo "branch_action=$branch_action"
            echo "file_action=$file_action"
          } >> "$GITHUB_OUTPUT"

      - name: Open proof PR
        id: pr
        env:
          REPO: ${{ github.repository }}
          AGENT: ${{ github.event.inputs.agent }}
          BRANCH: ${{ steps.proof.outputs.branch }}
          PROOF_PATH: ${{ steps.proof.outputs.proof_path }}
          COMMIT_SHA: ${{ steps.proof.outputs.commit_sha }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$APP_TOKEN"
          cat > pr-body.md <<EOF
          ## Agent Swarm Signing Proof

          This PR tests the ${AGENT} per-agent GitHub App landing path.

          - Canonical coordination issue: #398
          - Evidence PR cited only as evidence: #408
          - Evidence commit: 067cdc0a141d995624ac9769592e5428e371f3a3
          - Selected App slug: ${APP_SLUG}
          - Proof file: \`${PROOF_PATH}\`
          - Proof commit: \`${COMMIT_SHA}\`

          This is not an attempt to merge unrelated payload. It exists to prove whether an App-authenticated API landing commit is GitHub-verified and acceptable to the required-signatures gate.
          EOF
          existing_pr="$(gh pr list \
            --repo "$REPO" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --limit 1 \
            --json number,url \
            --jq '.[0] // empty')"
          if [ -n "$existing_pr" ]; then
            number="$(jq -r '.number' <<< "$existing_pr")"
            url="$(jq -r '.url' <<< "$existing_pr")"
            gh pr edit "$number" \
              --repo "$REPO" \
              --title "proof(signing): ${AGENT} App landing verification" \
              --body-file pr-body.md
            pr_action="updated"
          else
            url="$(gh pr create \
              --repo "$REPO" \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "proof(signing): ${AGENT} App landing verification" \
              --body-file pr-body.md)"
            number="${url##*/}"
            pr_action="created"
          fi
          {
            echo "url=$url"
            echo "number=$number"
            echo "action=$pr_action"
          } >> "$GITHUB_OUTPUT"

      - name: Verify proof commit
        id: verify
        env:
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.proof.outputs.commit_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$APP_TOKEN"
          expected_bot="${APP_SLUG}[bot]"
          gh api "repos/$REPO/commits/$COMMIT_SHA" > commit.json
          jq '.commit.verification' commit.json > verification.json
          verified="$(jq -r '.verified' verification.json)"
          reason="$(jq -r '.reason' verification.json)"
          author_login="$(jq -r '.author.login // ""' commit.json)"
          committer_login="$(jq -r '.committer.login // ""' commit.json)"
          author_email="$(jq -r '.commit.author.email // ""' commit.json)"
          committer_email="$(jq -r '.commit.committer.email // ""' commit.json)"
          identity_ok="false"
          if [ "$verified" = "true" ] &&
             [ "$reason" = "valid" ] &&
             [ "$author_login" = "$expected_bot" ] &&
             [ "$committer_login" = "$expected_bot" ]; then
            identity_ok="true"
          fi
          if ! gh pr checks "$PR_NUMBER" --repo "$REPO" --json name,state,conclusion,detailsUrl > checks.json; then
            rm -f checks.json
          elif [ ! -s checks.json ]; then
            rm -f checks.json
          fi
          {
            echo "verified=$verified"
            echo "reason=$reason"
            echo "expected_bot=$expected_bot"
            echo "author_login=$author_login"
            echo "committer_login=$committer_login"
            echo "author_email=$author_email"
            echo "committer_email=$committer_email"
            echo "identity_ok=$identity_ok"
          } >> "$GITHUB_OUTPUT"

      - name: Record result on signing issue
        if: always()
        env:
          FALLBACK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AGENT: ${{ github.event.inputs.agent }}
          BRANCH: ${{ steps.proof.outputs.branch }}
          PROOF_PATH: ${{ steps.proof.outputs.proof_path }}
          COMMIT_SHA: ${{ steps.proof.outputs.commit_sha }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_ACTION: ${{ steps.pr.outputs.action }}
          VERIFIED: ${{ steps.verify.outputs.verified }}
          REASON: ${{ steps.verify.outputs.reason }}
          EXPECTED_BOT: ${{ steps.verify.outputs.expected_bot }}
          AUTHOR_LOGIN: ${{ steps.verify.outputs.author_login }}
          COMMITTER_LOGIN: ${{ steps.verify.outputs.committer_login }}
          AUTHOR_EMAIL: ${{ steps.verify.outputs.author_email }}
          COMMITTER_EMAIL: ${{ steps.verify.outputs.committer_email }}
          IDENTITY_OK: ${{ steps.verify.outputs.identity_ok }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${APP_TOKEN:-$FALLBACK_GITHUB_TOKEN}"
          marker="<!-- agent-swarm-signing-proof:${AGENT} -->"
          {
            echo "$marker"
            echo ""
            echo "## Agentic Swarm Signing Proof Result"
            echo ""
            echo "- Agent lane: \`${AGENT}\`"
            echo "- App slug: \`${APP_SLUG:-unknown}\`"
            echo "- App installation id: \`${INSTALLATION_ID:-unknown}\`"
            echo "- Proof branch: \`${BRANCH:-not-created}\`"
            echo "- Proof PR: ${PR_URL:-not-created}"
            echo "- Proof PR action: \`${PR_ACTION:-not-created}\`"
            echo "- Proof file: \`${PROOF_PATH:-not-created}\`"
            echo "- Proof commit: \`${COMMIT_SHA:-not-created}\`"
            echo "- GitHub verification: \`${VERIFIED:-not-queried}\`"
            echo "- Verification reason: \`${REASON:-not-queried}\`"
            echo "- Expected bot: \`${EXPECTED_BOT:-not-queried}\`"
            echo "- Author login: \`${AUTHOR_LOGIN:-not-queried}\`"
            echo "- Committer login: \`${COMMITTER_LOGIN:-not-queried}\`"
            echo "- Author email: \`${AUTHOR_EMAIL:-not-queried}\`"
            echo "- Committer email: \`${COMMITTER_EMAIL:-not-queried}\`"
            echo "- Identity alignment: \`${IDENTITY_OK:-not-queried}\`"
            echo ""
            if [ -f verification.json ]; then
              echo "Verification JSON summary:"
              echo ""
              echo '```json'
              jq '{verified, reason, verified_at, signer: .signer, was_signed_by_github}' verification.json
              echo '```'
            else
              echo "Verification JSON summary: not available."
            fi
            echo ""
            if [ -f checks.json ]; then
              echo "Initial PR check state:"
              echo ""
              echo '```json'
              jq '.' checks.json
              echo '```'
            else
              echo "Initial PR check state: not available."
            fi
            echo ""
            if [ "${VERIFIED:-}" = "true" ]; then
              if [ "${IDENTITY_OK:-}" = "true" ]; then
                echo "Signing gate signal: proof commit is GitHub-verified and identity-aligned."
              else
                echo "Signing gate signal: proof commit is GitHub-verified, but actor/author/committer identity alignment failed."
              fi
            elif [ -z "${COMMIT_SHA:-}" ]; then
              echo "Signing gate signal: no proof commit was created. The selected App credential is missing, invalid, or did not mint a usable installation token."
            else
              echo "Signing gate signal: proof commit did not verify, or verification could not be queried."
            fi
          } > issue-comment.md
          existing_comment_id="$(gh api --paginate "repos/$REPO/issues/398/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n 1)"
          if [ -n "$existing_comment_id" ]; then
            body="$(cat issue-comment.md)"
            gh api "repos/$REPO/issues/comments/$existing_comment_id" \
              --method PATCH \
              -f body="$body" >/dev/null
          else
            gh issue comment 398 --repo "$REPO" --body-file issue-comment.md
          fi

      - name: Close failed proof PR
        if: ${{ steps.verify.outputs.identity_ok != 'true' && steps.pr.outputs.number != '' }}
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          export GH_TOKEN="$APP_TOKEN"
          gh pr close "$PR_NUMBER" --repo "$REPO" --comment "Closing failed signing proof: commit verification or identity alignment did not pass."

      - name: Fail if proof commit is not verified and identity-aligned
        if: ${{ steps.verify.outputs.identity_ok != 'true' }}
        run: |
          echo "Proof commit was not GitHub-verified with valid identity alignment." >&2
          exit 1
