name: Agent Review Gate

# Periodically re-derives open PR review state from GitHub truth so drift can be
# corrected without waiting for a fresh webhook event. Agent-authored PRs remain
# human-reviewed; Dependabot eligibility is handled by dependabot-rhythm only.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      grace_minutes:
        description: 'Legacy review-state compatibility window'
        required: false
        default: '30'

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow surfaces
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Reconcile open PR review state
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRACE_MINUTES: ${{ github.event.inputs.grace_minutes || '30' }}
        run: |
          python3 .github/scripts/review_feedback_loop.py \
            reconcile-open-prs \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --grace-minutes "$GRACE_MINUTES" > pr-loop-reconcile.json
          cat pr-loop-reconcile.json

      - name: Build PR loop watchdog report
        id: watchdog
        run: |
          python3 .github/scripts/pr_loop_watchdog.py \
            --report-json pr-loop-reconcile.json \
            --report-path pr-loop-watchdog.md

      - name: Sweep action_required runs
        # IF 8 (action_required runs are a triage surface distinct from PR state)
        # per !/ARBORSCAPE-PR-EXPANSION-2026-05-22.md. Folds findings into the
        # existing PR Loop Watchdog report rather than creating a separate issue.
        id: action_required
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs=$(gh run list \
            --repo "$REPO" \
            --limit 100 \
            --json conclusion,name,headBranch,databaseId,createdAt,event)
          ar=$(echo "$runs" | jq '[.[] | select(.conclusion=="action_required")]')
          count=$(echo "$ar" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "has_action_required=false" >> "$GITHUB_OUTPUT"
            echo "::notice::action_required queue is empty"
            exit 0
          fi
          echo "has_action_required=true" >> "$GITHUB_OUTPUT"
          echo "::notice::action_required queue has $count runs"
          {
            echo ""
            echo "## Action Required Queue"
            echo ""
            echo "Workflow runs waiting on human action: **$count**"
            echo ""
            echo "$ar" | jq -r '.[] | "- run #\(.databaseId): `\(.name)` on `\(.headBranch)` — \(.event), \(.createdAt[0:16])"'
          } >> pr-loop-watchdog.md

      - name: Publish PR loop summary
        run: cat pr-loop-watchdog.md >> "$GITHUB_STEP_SUMMARY"

      - name: Sync PR loop watchdog issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          watchdog_findings="${{ steps.watchdog.outputs.has_findings }}"
          action_required_findings="${{ steps.action_required.outputs.has_action_required }}"
          if [ "$watchdog_findings" = "true" ] || [ "$action_required_findings" = "true" ]; then
            combined="true"
          else
            combined="false"
          fi
          python3 .github/scripts/issue_reconciler.py \
            --title "[PR Loop Watchdog] Reconciliation report" \
            --body-file pr-loop-watchdog.md \
            --has-findings "$combined" \
            --resolved-comment "Resolved automatically: the latest PR reconciliation found no unresolved blockers."
