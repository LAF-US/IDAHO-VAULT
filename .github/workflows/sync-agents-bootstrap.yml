name: Sync Agent Discovery Index

on:
  push:
    paths:
      - "swarm.json"

jobs:
  # logan/obsidian is Logan's live-edit branch, synced directly from the
  # Obsidian desktop app -- nothing in that path regenerates the index before
  # pushing, so the fail-closed check below recurs chronically (tracked in
  # issue #822 / AUDIT-CI-FAILURE-SWEEP-2026-07-08). Self-heal there instead
  # of just reporting the drift every push.
  check-bootstrap:
    name: Verify agent discovery index is current
    if: github.ref != 'refs/heads/logan/obsidian'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Check agent discovery index is in sync
        run: |
          python3 .github/scripts/generate_agents_bootstrap.py --check

  self-heal-bootstrap:
    name: Auto-fix agent discovery index drift on logan/obsidian
    if: github.ref == 'refs/heads/logan/obsidian'
    runs-on: ubuntu-latest
    concurrency:
      group: sync-agents-bootstrap-logan-obsidian
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: logan/obsidian

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Regenerate agent discovery index
        run: |
          python3 .github/scripts/generate_agents_bootstrap.py

      - name: Commit and push if drift was corrected
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "!/agents.json" agents.json
          if git diff --cached --quiet; then
            echo "Agent discovery index already in sync"
            exit 0
          fi
          git commit -m "chore(sync): auto-heal agent discovery index drift on logan/obsidian"
          git push origin HEAD:logan/obsidian
