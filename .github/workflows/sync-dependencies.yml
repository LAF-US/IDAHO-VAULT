name: Sync Dependencies

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-dependencies-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH_NAME: automation/sync-dependencies
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned pip-tools
        run: python -m pip install "pip-tools==7.4.1"

      - name: Generate requirements.txt
        id: compile
        continue-on-error: true
        run: pip-compile pyproject.toml -o requirements.txt --upgrade

      - name: Publish review branch and PR
        if: steps.compile.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add requirements.txt
          if git diff --cached --quiet; then
            echo "No changes to propose"
            exit 0
          fi
          git switch -c "$BRANCH_NAME"
          git commit -m "chore: sync requirements.txt from pyproject.toml"
          git fetch origin "$BRANCH_NAME" || true
          git push --force-with-lease origin "HEAD:$BRANCH_NAME"
          if ! gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq 'length > 0' | grep -q '^true$'; then
            gh pr create --base main --head "$BRANCH_NAME" --title "chore: sync requirements.txt" --body "Automated dependency lock synchronization. Review required before merge."
          fi

      - name: Report dependency resolver conflict
        if: steps.compile.outcome != 'success'
        run: |
          {
            echo "## Sync Dependencies"
            echo ""
            echo "Dependency resolution failed; no review branch was created."
            echo "Treat this as Python dependency triage."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
