name: Sync Dependencies

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-dependencies-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH_NAME: automation/sync-dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

      - name: Refresh uv.lock
        id: uvlock
        continue-on-error: true
        run: uv lock --upgrade

      - name: Export requirements.txt from uv.lock
        id: export
        if: steps.uvlock.outcome == 'success'
        continue-on-error: true
        run: uv export --format requirements-txt --no-hashes --output-file requirements.txt

      - name: Publish review branch and PR
        if: steps.uvlock.outcome == 'success' && steps.export.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add requirements.txt uv.lock
          if git diff --cached --quiet; then
            echo "No changes to propose"
            exit 0
          fi
          git switch -c "$BRANCH_NAME"
          git commit -m "chore: sync requirements.txt and uv.lock from pyproject.toml"
          git fetch origin "$BRANCH_NAME" || true
          git push --force-with-lease origin "HEAD:$BRANCH_NAME"
          if ! gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq 'length > 0' | grep -q '^true$'; then
            gh pr create --base main --head "$BRANCH_NAME" --title "chore: sync requirements.txt and uv.lock" --body "Automated dependency lock synchronization. Review required before merge."
          fi

      - name: Report dependency resolver conflict
        if: steps.uvlock.outcome != 'success' || steps.export.outcome != 'success'
        run: |
          {
            echo "## Sync Dependencies"
            echo ""
            if [ "${{ steps.uvlock.outcome }}" != "success" ]; then
              echo "\`uv lock --upgrade\` failed; no review branch was created."
            elif [ "${{ steps.export.outcome }}" != "success" ]; then
              echo "\`uv export\` failed after a successful lock; no review branch was created."
            fi
            echo ""
            echo "Treat this as Python dependency triage."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
