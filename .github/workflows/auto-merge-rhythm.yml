name: Auto-merge Rhythm — Sync Bot

# Companion to dependabot-rhythm.yml. Enables auto-merge only on the
# repo's own dependency-sync PRs so that routine, scope-clean updates
# flow through the merge queue without manual clicks.
#
# FAIL-CLOSED (2026-06-16, #521): the former `user.login == 'loganfinney27'`
# arm was removed. Author login is a counterfeit-identity gate — agents
# author PRs *as* loganfinney27 through a shared token, so arming on the
# login armed agent work as if the keyed human had acted (the merge-side
# twin of a blind auto-resolve). The correct replacement is to arm only on
# a GitHub-VERIFIED signature that resolves to a distinct maintainer
# identity — which is blocked on the signing-chain decision in #398
# (human-signing chain still breaks; per-agent App signing not yet
# provisioned). Until #398 lands an identity-distinct verified signer, no
# login-based maintainer auto-arm exists; Logan merges his own PRs by hand.
#
# UPDATE (2026-06-17): the broader fail-close was reversed for the ENGINE arming
# lane (review_feedback_loop.py: AGENT_AUTO_MERGE_ENABLED=True). What changed is the
# gate, not the identity: `main` now lands through the GitHub merge queue, which
# provides the distinct trust gate #521 lacked (ARBORSCAPE IF 12) — a PR merges only
# once its required checks/reviews/thread-resolution pass, whoever armed it. The engine
# now arms eligible (risk/low + grace + thread-clear), non-protected-path PRs. See
# AGENT-AUTOMERGE-REENABLED-2026-06-17.md. THIS sync-bot lane is unchanged — it never
# keyed on author login and its narrow dependency-sync scope is still correct.
#
# Same protected-path guard and required-checks verification as the
# Dependabot job. PRs that touch governance, workflows, or agent
# scaffolding still fail eligibility and wait for human review.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Job id retained as `auto-merge-maintainer` to avoid breaking any
  # branch-protection / check references; its scope is now sync-bot only.
  auto-merge-maintainer:
    if: >
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'chore: sync requirements.txt and uv.lock')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted classifier
        # pull_request_target runs from the trusted base; check out the default branch
        # (never PR-authored code) so classify_paths.py is the vault's own, not the PR's.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Exclude protected live surfaces from automatic merge
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          eligible=true
          # Fail closed: if the file list cannot be fetched (auth, network,
          # rate limit), refuse rather than skip the protected-path check.
          if ! files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"; then
            echo "::error::Unable to list PR files; refusing to enable auto-merge."
            exit 1
          fi

          # K1/K2 (#627/#628): defer to the classifier's FILEPLACEMENT verdict — the SINGLE
          # source of protected-surface truth — instead of a hand-maintained glob that drifts.
          # classify_paths.py already pins .github/, governance files, dotfolders, and the Nest
          # to the placement axis; reading it here retires the duplicate glob, so adding a
          # protected surface in the classifier protects this lane for free. The script is
          # stdlib-only, so the runner's python3 needs no setup-python step.
          #
          # Key on `depth` (placement axis), NOT `tier`: `tier` folds in the filetype axis, so a
          # med-filetype file (e.g. `uv.lock`, an unknown `.lock` extension -> conservative med)
          # would read tier=high and wrongly block the sync-bot's OWN dependency PRs. The retired
          # glob was placement-only; `depth in {high,nope}` is its exact equivalent (a med maze
          # file has depth=None and stays eligible). Fail CLOSED if the classifier errors or
          # emits output we cannot parse — never silently treat a failure as eligible.
          if ! depth="$(printf '%s\n' "$files" | python3 .github/scripts/classify_paths.py \
                | python3 -c 'import sys, json; print(json.load(sys.stdin)["depth"] or "")')"; then
            echo "::error::Classifier failed or emitted unparseable output; refusing to enable auto-merge."
            exit 1
          fi
          if [ "$depth" = "high" ] || [ "$depth" = "nope" ]; then
            echo "::notice::Manual review required — classifier scored a protected placement ('$depth') surface."
            eligible=false
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Verify protected required checks exist
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The four policy checks must have PASSED on this PR (existence + success) — decoupled
          # from whether they're required-for-merge in the ruleset. This step runs early (on
          # pull_request_target) and there is no check-completion re-trigger, so POLL until each
          # check-run is completed (they run on every pull_request and finish fast), then require
          # success. A check that's pending/absent is waited on, not failed-closed; only a real
          # non-success or the timeout blocks arming.
          contexts="check-secret-patterns check-large-files check-paths check-dotfolder-anchors"
          deadline=$(( $(date +%s) + 900 ))   # 15-minute budget
          while :; do
            # Fail closed on a real API error rather than letting an empty result
            # masquerade as "still pending" and surface a misleading timeout.
            if ! runs="$(gh api --paginate "repos/$GH_REPO/commits/$HEAD_SHA/check-runs" --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion)"')"; then
              echo "::error::Unable to fetch check-runs for $HEAD_SHA (auth/rate-limit/network); refusing to enable auto-merge."
              exit 1
            fi
            pending=""
            for c in $contexts; do
              line="$(printf '%s\n' "$runs" | awk -F'\t' -v c="$c" '$1==c{print; exit}')"
              st="$(printf '%s' "$line" | cut -f2)"
              { [ -z "$line" ] || [ "$st" != "completed" ]; } && pending="$pending $c"
            done
            [ -z "$pending" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Maintainer auto-merge gate: policy checks did not complete in time:$pending"
              exit 1
            fi
            echo "Waiting for policy checks to complete:$pending"
            sleep 20
          done
          for c in $contexts; do
            concl="$(printf '%s\n' "$runs" | awk -F'\t' -v c="$c" '$1==c{print $3; exit}')"
            if [ "$concl" != "success" ]; then
              echo "::error::Maintainer auto-merge is disabled until '$c' passes on this PR (got: ${concl:-missing})."
              exit 1
            fi
          done

      - name: Enable verified auto-merge
        if: steps.scope.outputs.eligible == 'true'
        # The arm actor becomes the future enqueue actor, and GITHUB_TOKEN-actored
        # events never dispatch workflow runs (GitHub anti-recursion) — prefer the
        # user-scoped MERGE_QUEUE_TOKEN so armed PRs enqueue with a dispatching actor.
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --merge "$PR_URL"
