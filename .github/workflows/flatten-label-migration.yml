name: Flatten Label Migration (one-shot)

# ONE-SHOT, dispatch-only migration from the retired 9-string risk vocabulary
#   filetype:risk/{—,low,med} + depth:risk/{—,high,nope} + legacy risk/{—,low,high}
# to the flat four:  risk/{low,med,high,nope}  (filetype fires low|med, filedepth
# fires high|nope, — = absence, —/— = no risk/* label). See the flatten in PR #854
# and WITNESS-THE-KEYS-ARE-THE-LEVERS-2026-06-21.md (2026-07-20 addendum).
#
# Run ONCE, by hand, AFTER PR #854 has merged to `main`: the live labeler runs from
# `main`, so running this before the merge would let main's old code re-stamp the
# prefixed labels straight back. The guard step below fails fast if the flat schema
# is not yet on the checked-out default branch.
#
# No cron (Logan's standing no-cron order) — workflow_dispatch only. Idempotent, and
# dry-run by default (preview the plan before writing). Delete this workflow once the
# migration has been run successfully — it is a one-shot, not standing machinery.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — no label writes or deletes"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # Repo-scoped PAT so label create/delete/edit is authorized; falls back to GITHUB_TOKEN.
      GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      NAME: ${{ github.event.repository.name }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Guard — the flat schema must be live on this ref
        run: |
          set -euo pipefail
          # If the retired prefixed vocabulary is still present, the flatten (#854) has
          # not merged — refuse, or we would fight main's old stamping code.
          if grep -q "FILETYPE_AXIS_PREFIX\|filetype:risk/" .github/scripts/review_feedback_loop.py; then
            echo "::error::Retired prefixed vocabulary still present on the default branch — merge the flatten (PR #854) before running this migration."
            exit 1
          fi
          echo "flat schema confirmed on the default branch"

      - name: Ensure flat labels exist (creates risk/med, risk/nope)
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] would run: review_feedback_loop.py ensure-labels (creates risk/med, risk/nope)"
          else
            python3 .github/scripts/review_feedback_loop.py ensure-labels
          fi

      - name: Re-stamp every open PR to the flat vocabulary
        run: |
          set -euo pipefail
          cd .github/scripts
          python3 - <<'PY'
          import json, os, subprocess
          import review_feedback_loop as r

          owner, name = os.environ["OWNER"], os.environ["NAME"]
          dry = os.environ["DRY_RUN"] == "true"

          listing = subprocess.run(
              ["gh", "pr", "list", "--repo", f"{owner}/{name}",
               "--state", "open", "--limit", "200", "--json", "number"],
              capture_output=True, text=True, check=True,
          ).stdout
          prs = [pr["number"] for pr in json.loads(listing)]
          print(f"{len(prs)} open PR(s) to re-stamp")

          for num in prs:
              # The engine's own classifier + restamp — pure label reconcile, no arming
              # or thread side effects. classify from the PR's current diff, stamp the
              # flat label(s) for the fired axes (—/— stamps nothing).
              ft, dp = r._classify_pr_pair(owner, name, num)
              # Fetch the PR's current labels so restamp can REMOVE stale flat risk/*
              # labels, not just add. An empty set would let restamp add the desired
              # labels but never strip a now-wrong one (e.g. a PR that reclassifies from
              # high to clear would keep risk/high, since the delete step only removes the
              # retired prefixed/legacy labels, not the flat ones).
              current = set(json.loads(subprocess.run(
                  ["gh", "pr", "view", str(num), "--repo", f"{owner}/{name}",
                   "--json", "labels", "--jq", "[.labels[].name]"],
                  capture_output=True, text=True, check=True,
              ).stdout))
              desired = set()
              if ft:
                  desired.add(r.FILETYPE_RISK_LABELS[ft])
              if dp:
                  desired.add(r.DEPTH_RISK_LABELS[dp])
              print(f"#{num}: verdict=({ft}, {dp}) -> {sorted(desired) or '—/— (no risk label)'}")
              if not dry:
                  # restamp manages only the flat RISK_FLAG_LABELS set; the old prefixed
                  # labels are removed wholesale by the delete step below.
                  r.restamp_risk_pair(num, current, ft, dp)
          PY

      - name: Delete the 7 retired label definitions
        run: |
          set -euo pipefail
          # Deleting a label definition strips it from every PR/issue at once.
          for L in "filetype:risk/—" "filetype:risk/low" "filetype:risk/med" \
                   "depth:risk/—" "depth:risk/high" "depth:risk/nope" "risk/—"; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would delete label: $L"
              continue
            fi
            # Preserve stderr and distinguish "label not found" (benign) from real
            # failures (auth, rate limit, API errors) — masking all non-zero exits as
            # "already gone" could falsely report success while leaving labels behind.
            if err=$(gh label delete "$L" --repo "$OWNER/$NAME" --yes 2>&1); then
              echo "deleted: $L"
            elif printf '%s' "$err" | grep -qiE 'not found|HTTP 404'; then
              echo "not present / already gone: $L"
            else
              echo "::error::failed to delete label '$L': $err"
              exit 1
            fi
          done

      - name: Verify no retired label remains on open PRs
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          hits=$(gh pr list --repo "$OWNER/$NAME" --state open --limit 200 --json labels \
            --jq '[.[].labels[].name] | map(select(test("^filetype:risk/|^depth:risk/|^risk/—$"))) | unique | .[]' || true)
          if [ -n "$hits" ]; then
            echo "::error::retired labels still present on open PRs:"; echo "$hits"; exit 1
          fi
          echo "clean — no retired risk labels remain on open PRs"
