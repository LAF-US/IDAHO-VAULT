name: NORMALIZATION Character Conformity Check

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

jobs:
  check-conformity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout trusted validator code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || github.event.repository.default_branch }}
          path: trusted-main

      - name: Check character conformity (BOM-aware UTF-8)
        shell: bash
        run: |
          set -eo pipefail  # a failed git diff must fail the step, not feed the checker empty stdin
          set +H  # Disable bash history expansion (paths contain !)
          VALIDATOR="trusted-main/.github/scripts/check_character_conformity.py"
          if [ ! -f "$VALIDATOR" ]; then
            echo "::notice::Trusted conformity helper not present on base yet; using candidate helper for bootstrap."
            VALIDATOR=".github/scripts/check_character_conformity.py"
          fi

          # --diff-filter=ACMRT: check only paths that EXIST in the result
          # (Added/Copied/Modified/Renamed/Type-changed), excluding Deleted (D).
          # Deleting a nonconforming file must never be blocked by the guard.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git -c core.quotePath=false diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" |
              python "$VALIDATOR" --paths-from-stdin
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            git -c core.quotePath=false diff --name-only --diff-filter=ACMRT \
              "${{ github.event.merge_group.base_sha }}" \
              "${{ github.event.merge_group.head_sha }}" |
              python "$VALIDATOR" --paths-from-stdin
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              git -c core.quotePath=false ls-tree -r --name-only "$after" |
                python "$VALIDATOR" --paths-from-stdin
            else
              git -c core.quotePath=false diff --name-only --diff-filter=ACMRT "$before" "$after" |
                python "$VALIDATOR" --paths-from-stdin
            fi
          fi
