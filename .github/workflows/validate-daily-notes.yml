name: Daily Notes Placeholder Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-date-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check for unresolved date-placeholder tokens
        shell: bash
        run: |
          set +H  # Disable bash history expansion

          # Determine which files to check. If the diff command fails (e.g. base
          # ref missing from checkout), fall back to the full tree so the check
          # still runs — a silent empty-file-list would make the job pass vacuously.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git -c core.quotePath=false diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}")
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              FILES=$(git -c core.quotePath=false ls-tree -r "$after" --name-only)
            else
              FILES=$(git -c core.quotePath=false diff --name-only "$before" "$after")
            fi
          fi

          # An array, not a string. A prior version appended a literal "\n" to a
          # string and printed it with `echo -e`, which interprets escapes in
          # file-derived content: a note containing the two characters \ n
          # followed by `::error::` would break onto a new line and the Actions
          # runner would parse it as a real workflow command.
          VIOLATIONS=()

          while IFS= read -r filepath; do
            [ -z "$filepath" ] && continue
            [ ! -f "$filepath" ] && continue

            # Scope: any periodic note or the carryforward list.
            # Filenames come from the title formats in the five NOTE TEMPLATEs:
            #   day YYYY-MM-DD | week GGGG-[W]WW | month YYYY-MM | quarter YYYY-[Q]Q
            # Yearly (YYYY) is deliberately NOT matched by filename -- a bare
            # four-digit name is not a reliable signal (1000.md exists at root
            # and is not a year note); yearly notes are caught by `period:`.
            base=$(basename -- "$filepath")
            dir=$(dirname -- "$filepath")

            # The five templates are written in the very syntax this check hunts
            # for. They must stay out of scope or the check fails on itself.
            case "$base" in
              *' NOTE TEMPLATE.md') continue ;;
            esac

            scoped=false
            if [ "$dir" = "." ]; then
              if [[ "$base" =~ ^[0-9]{4}-([0-9]{2}-[0-9]{2}|W[0-9]{1,2}|Q[1-4]|[0-9]{2})\.md$ ]]; then
                scoped=true
              elif [ "$base" = "TO DO LIST.md" ]; then
                scoped=true
              fi
            fi
            # Any note declaring itself periodic, wherever it lives.
            #
            # Read `period:` from the frontmatter block ONLY -- awk stops at the
            # closing `---`, and bails immediately if the file does not open with
            # one. A prior version piped `head -n 40` straight into grep, which
            # scanned raw text: a body line reading `period: day` scoped the file
            # in, and frontmatter longer than 40 lines was silently skipped.
            #
            # Matching mirrors is_periodic_surface() in validate_content.py, which
            # tests `period.strip().lower() in PERIOD_VALUES` on a yaml.safe_load()
            # mapping -- hence -i for case, optional quotes, and a tolerated
            # trailing comment. Exact parity with a YAML parser is not claimed;
            # where this differs it fails closed (misses a scope) rather than
            # scoping in a file the Python would ignore.
            if [ "$scoped" = "false" ]; then
              frontmatter=$(awk '
                NR == 1 && $0 !~ /^---/ { exit }
                NR == 1                 { next }
                /^---[[:space:]]*$/     { exit }
                                        { print }
              ' < "$filepath")
              if printf '%s\n' "$frontmatter" \
                | grep -qiE '^period:[[:space:]]*"?'"'"'?(day|week|month|quarter|year)'"'"'?"?[[:space:]]*(#.*)?$'; then
                scoped=true
              fi
            fi
            [ "$scoped" = "false" ] && continue

            # Unrendered template placeholders: Templater `<% ... %>` and core
            # Obsidian Templates `{{...}}`. These are what a failed expansion
            # actually leaves behind.
            #
            # awk rather than grep so fenced blocks are skipped, matching
            # validate_template_placeholders() in validate_content.py -- a note
            # may legitimately show template syntax inside a fence. The two
            # implementations must stay equivalent; a plain grep here would
            # flag fenced examples that the Python passes.
            # Read via stdin so a leading-dash path can never be read as a flag.
            hits=$(awk '
              /^[[:space:]]*(```|~~~)/ { fence = !fence; next }
              fence { next }
              /<%|\{\{[^}]+\}\}/ { print FNR": "$0 }
            ' < "$filepath")
            if [ -n "$hits" ]; then
              while IFS= read -r hit; do
                VIOLATIONS+=("  ${filepath}:${hit}")
              done <<< "$hits"
            fi
          done <<< "$FILES"

          if [ ${#VIOLATIONS[@]} -gt 0 ]; then
            echo "::error::Unrendered template placeholders detected in a periodic note or TO DO LIST.md"
            echo ""
            echo "Templater (<% ... %>) and core Obsidian Templates ({{...}}) syntax"
            echo "left in a note means template expansion failed for that note. The"
            echo "placeholder is inert where it sits, but daily_rollover.py carries"
            echo "content from these surfaces forward, so it propagates every run and"
            echo "contaminates subsequent notes."
            echo ""
            echo "Offending lines:"
            printf '%s\n' "${VIOLATIONS[@]}"
            echo ""
            echo "Fix: substitute the value the template would have produced."
            exit 1
          fi

          echo "No unrendered template placeholders in periodic notes or TO DO LIST.md."
