name: Engage Outdated — attest-resolve outdated review threads

# The first "engage" step of the look-then-resolve engine (#399). Logan's model: the
# queue runs by default and reviewer comments are what keep a PR hanging. This engages the
# NARROWEST safe slice — it attest-resolves ONLY bot-only, GitHub-outdated review threads
# (the commented lines no longer exist in the diff), each with a recorded
# github-actions[bot] attestation, so it is a witnessed resolution, NOT the disabled blind
# reconciler. It never touches needs-fix (the reviewer gate), apply-suggestion, or human
# threads, and it NEVER merges — if clearing a PR's last thread lets an armed PR flow, that
# is GitHub's auto-merge, by design.
#
# Dry-run by default. Dispatch with apply=true to engage. (A schedule is a deliberate
# follow-up once this is proven on the live backlog.)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = post attestations and resolve; false = dry-run (report only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  pull-requests: write

jobs:
  engage-outdated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow surfaces
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Engage outdated-only resolution
        # All ${{ }} values pass through env, never interpolated into the run script
        # (apply is a user-controllable dispatch input — direct expansion would be a
        # template-injection vector). github-actions[bot] is the looker identity.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python3 .github/scripts/review_feedback_loop.py engage-outdated \
              --owner "$OWNER" --repo "$REPO" --apply | tee engage-outdated.json
          else
            python3 .github/scripts/review_feedback_loop.py engage-outdated \
              --owner "$OWNER" --repo "$REPO" | tee engage-outdated.json
          fi

      - name: Publish summary
        env:
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          {
            echo '## Engage Outdated — outdated-only resolution'
            echo ''
            echo "> apply = ${APPLY}  ·  witnessed (github-actions[bot] attestation); never merges"
            echo ''
            echo '```json'
            jq '{apply, outdated_threads, resolved}' engage-outdated.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
