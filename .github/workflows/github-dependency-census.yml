name: GitHub Dependency Census

on:
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted report code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Build dependency census
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/github_dependency_report.py \
            --repo "${{ github.repository }}" \
            --markdown-path github-dependency-census.md \
            --json-path github-dependency-census.json \
            --timeout 30 \
            --max-pages 10

      - name: Publish summary
        run: cat github-dependency-census.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-dependency-census
          path: |
            github-dependency-census.md
            github-dependency-census.json
          if-no-files-found: error
          retention-days: 14
