name: Large File Policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Checkout trusted validator code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: trusted-main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Check changed files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only -z --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" |
              python trusted-main/.github/scripts/check_large_files.py --paths-from-stdin
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              git ls-tree -r -z --name-only "$after" |
                python trusted-main/.github/scripts/check_large_files.py --paths-from-stdin
            else
              git diff --name-only -z --diff-filter=ACMR "$before" "$after" |
                python trusted-main/.github/scripts/check_large_files.py --paths-from-stdin
            fi
          fi
