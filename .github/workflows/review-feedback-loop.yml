name: Review Feedback Loop

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  acknowledge-copilot-apply:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow surfaces
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Mark PR as waiting on Copilot follow-up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python3 .github/scripts/review_feedback_loop.py \
            acknowledge-apply \
            --owner "${{ github.repository_owner }}" \
            --repo "$REPO_NAME" \
            --pr-number "${{ github.event.issue.number }}" \
            --comment-author "${{ github.event.comment.user.login }}" \
            --author-association "${{ github.event.comment.author_association }}" \
            --comment-body "$COMMENT_BODY"

  sweep-review-threads:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      # contents: write is required to enable merge-queue auto-merge
      # (enablePullRequestAutoMerge is gated like resolveReviewThread, #546). sync-pr
      # arms eligible, non-protected-path PRs (#521/#527 reversal, 2026-06-17). Scoped
      # scoped to this job only; outside this job, `contents` stays read-only at the
      # workflow level (the other jobs do not get write access).
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted workflow surfaces
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sweep outdated advisory threads after PR updates
        # The arm actor becomes the future enqueue actor, and GITHUB_TOKEN-actored
        # events never dispatch workflow runs (GitHub anti-recursion) — prefer the
        # user-scoped MERGE_QUEUE_TOKEN so armed PRs enqueue with a dispatching actor.
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python3 .github/scripts/review_feedback_loop.py \
            sync-pr \
            --owner "${{ github.repository_owner }}" \
            --repo "$REPO_NAME" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --sync-actor "${{ github.actor }}"

  verify-agent-claims:
    # IF 7 (brass-mouth reliability is per-utterance, not per-agent) per
    # !/ARBORSCAPE-PR-EXPANSION-2026-05-22.md (Phase 1a). Fires broadly on PR
    # comments; the subcommand filters narrowly via regex and only posts a
    # divergence note when the agent's claim disagrees with the institutional
    # GitHub state. The marker on its own divergence comment prevents recursion
    # and duplicate noise.
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow surfaces
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify agent completion claims against PR state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python3 .github/scripts/review_feedback_loop.py \
            verify-claim \
            --owner "${{ github.repository_owner }}" \
            --repo "$REPO_NAME" \
            --pr-number "${{ github.event.issue.number }}" \
            --comment-author "${{ github.event.comment.user.login }}" \
            --comment-body "$COMMENT_BODY"
