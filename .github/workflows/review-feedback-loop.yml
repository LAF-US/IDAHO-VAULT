name: Review Feedback Loop

on:
  issue_comment:
    types: [created]
  # Thread resolution is itself an unblock signal. The recompute/arm step below
  # (sync-pr) gates merge on thread state, but nothing re-ran it when the LAST
  # thread was resolved out-of-band — a human UI resolve, the engage-outdated
  # witness, or a Copilot follow-up. So a PR could sit `blocked` with a stale
  # review/threads-open label until an unrelated push/reopen happened to nudge
  # it. Wiring pull_request_review_thread closes that gap: resolving the last
  # thread recomputes state and arms an eligible PR immediately.
  #
  # Safe the same way review-response.yml (pull_request_review) already is: this
  # event runs the workflow from the trusted DEFAULT branch and the job checks
  # out the default branch, so no untrusted PR-head code executes. Arming is not
  # merging — branch protection still gates the actual merge. Recursion is
  # bounded: when sync-pr resolves an outdated thread it uses GITHUB_TOKEN, and
  # GitHub does not spawn new workflow runs from GITHUB_TOKEN-driven events.
  pull_request_review_thread:
    types: [resolved, unresolved]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  acknowledge-copilot-apply:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow surfaces
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Mark PR as waiting on Copilot follow-up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 .github/scripts/review_feedback_loop.py \
            acknowledge-apply \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --pr-number "${{ github.event.issue.number }}" \
            --comment-author "${{ github.event.comment.user.login }}" \
            --author-association "${{ github.event.comment.author_association }}" \
            --comment-body "$COMMENT_BODY"

  sweep-review-threads:
    if: >
      github.event_name == 'pull_request_target' ||
      github.event_name == 'pull_request_review_thread'
    runs-on: ubuntu-latest
    permissions:
      # contents: write is required to enable merge-queue auto-merge
      # (enablePullRequestAutoMerge is gated like resolveReviewThread, #546). sync-pr
      # arms eligible, non-protected-path PRs (#521/#527 reversal, 2026-06-17). Scoped
      # scoped to this job only; outside this job, `contents` stays read-only at the
      # workflow level (the other jobs do not get write access).
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted workflow surfaces
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sweep outdated advisory threads after PR updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/review_feedback_loop.py \
            sync-pr \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --sync-actor "${{ github.actor }}"

  verify-agent-claims:
    # IF 7 (brass-mouth reliability is per-utterance, not per-agent) per
    # !/ARBORSCAPE-PR-EXPANSION-2026-05-22.md (Phase 1a). Fires broadly on PR
    # comments; the subcommand filters narrowly via regex and only posts a
    # divergence note when the agent's claim disagrees with the institutional
    # GitHub state. The marker on its own divergence comment prevents recursion
    # and duplicate noise.
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow surfaces
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify agent completion claims against PR state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 .github/scripts/review_feedback_loop.py \
            verify-claim \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --pr-number "${{ github.event.issue.number }}" \
            --comment-author "${{ github.event.comment.user.login }}" \
            --comment-body "$COMMENT_BODY"

