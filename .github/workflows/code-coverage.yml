name: Code Coverage

# Runs the same tests/ suite as "Python Test Suite" under `coverage`, then
# prints a per-file report to the job summary. Informational only -- no
# threshold gate, no artifact upload, no third-party service. That's a
# separate policy decision for Logan; this just gives visibility into what
# the existing suite does and doesn't exercise.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

      - name: uv sync (installs pyproject + dev group per uv.lock)
        run: uv sync

      - name: Run test suite under coverage
        run: uv run coverage run -m unittest discover -s tests -p "test_*.py" -v

      - name: Report coverage
        if: always()
        run: |
          uv run coverage report -m | tee coverage-report.txt
          {
            echo "### Coverage report"
            echo '```'
            cat coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
