name: Secret Pattern Policy

on:
  pull_request:
  push:
    # Broadened 2026-07-02 from [main] only: the leak was a direct push to a
    # working branch (logan/obsidian), which the main-only trigger never scanned.
    # Runs on every branch push now; the job scopes the new-branch case
    # (before==0000…) to the files that branch introduces, and falls back to the
    # whole tree if it cannot isolate them.
    branches: ['**']
  merge_group:
  workflow_dispatch:

concurrency:
  # Push groups are SHA-specific, so push runs never cancel each other.
  # These checks scan only the push's own before..after delta, so a cancelled
  # push run loses that delta's coverage for good: push A adds a violation,
  # push B touches an unrelated file and cancels A, and B then scans only its
  # own files while A's remain on the branch, unexamined. pull_request runs
  # scan base..head, which is cumulative, so superseding one loses nothing.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  check-secret-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
      - name: Checkout trusted validator code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || github.event.repository.default_branch }}
          path: trusted-main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check changed files for secret patterns
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eo pipefail  # a failed git diff must fail the step, not feed the checker empty stdin
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only -z --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" |
              python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            git diff --name-only -z --diff-filter=ACMR \
              "${{ github.event.merge_group.base_sha }}" \
              "${{ github.event.merge_group.head_sha }}" |
              python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              # New branch: there is no `before` to diff against, but "everything in
              # the repo" is the wrong answer. It re-reports ~55 findings that were
              # already here (minified plugin bundles, clipped articles with embedded
              # map keys) on every branch anyone creates, which is how a gate that
              # caught a real leak gets trained into noise people click past.
              #
              # Diff from the merge-base with the default branch. That is the ONLY
              # baseline in this repo that has actually been scanned: the default
              # branch is scanned on every push to it and on every pull_request.
              #
              # An earlier version of this subtracted every other ref instead
              # (`rev-list --not <all branches and tags>`) to find "commits unique to
              # this branch". That asserts those refs are clean history, and they are
              # not: until this workflow's trigger was broadened, only the default
              # branch was scanned on push, so a sibling branch ref may never have
              # been scanned at all — and a ref survives a scan that FAILED. If such a
              # ref points at secret-bearing commit S and this branch adds U on top,
              # subtracting it sets base to S and the S..U scan steps over the secret.
              # The leak that broadened this trigger on 2026-07-02 was a direct push to
              # a working branch, which is exactly that shape.
              #
              # Cost of using merge-base instead: a branch cut from another unmerged
              # branch rescans that branch's files too. That is an over-scan — noise —
              # and noise is the correct direction for a secret gate to fail.
              base=""
              for ref in "origin/${DEFAULT_BRANCH}" "${DEFAULT_BRANCH}"; do
                if git rev-parse -q --verify "$ref" >/dev/null 2>&1; then
                  base=$(git merge-base "$ref" "$after" 2>/dev/null) && break
                  base=""
                fi
              done

              if [ -n "$base" ]; then
                echo "New branch: scanning $base..$after (files this branch introduces)"
                git diff --name-only -z --diff-filter=ACMR "$base" "$after" |
                  python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
              else
                # Fail closed. If the branch's own commits cannot be isolated (root
                # commit, orphan branch, no other refs fetched), scan everything
                # rather than scan nothing. Worst case is the previous behaviour.
                echo "New branch: cannot isolate branch commits; scanning whole tree."
                git ls-tree -r -z --name-only "$after" |
                  python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
              fi
            else
              git diff --name-only -z --diff-filter=ACMR "$before" "$after" |
                python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
            fi
          fi
