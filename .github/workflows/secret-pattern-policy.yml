name: Secret Pattern Policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-secret-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Checkout trusted validator code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: trusted-main
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
      - name: Check changed files for secret patterns
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only -z --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" |
              python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              git ls-tree -r -z --name-only "$after" |
                python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
            else
              git diff --name-only -z --diff-filter=ACMR "$before" "$after" |
                python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
            fi
          fi
