name: Secret Pattern Policy

on:
  pull_request:
  push:
    # Broadened 2026-07-02 from [main] only: the leak was a direct push to a
    # working branch (logan/obsidian), which the main-only trigger never scanned.
    # Runs on every branch push now; the job scopes the new-branch case
    # (before==0000…) to the files that branch introduces, and falls back to the
    # whole tree if it cannot isolate them.
    branches: ['**']
  merge_group:
  workflow_dispatch:

# Supersede, don't stack: a second push to the same branch cancels the still-running
# check for the previous commit, which nobody is waiting on. The final state of the
# branch is still checked in full, so no coverage is lost.
#
# `github.event_name` is in the group key on purpose: it keeps the push-event run and
# the pull_request-event run of the same branch in SEPARATE groups. Collapsing them
# would let a push run cancel a required PR check, and a cancelled required check
# blocks the PR.
#
# merge_group is never cancelled — cancelling a merge-queue check breaks the queue.
concurrency:
  # Push groups are SHA-specific, so push runs never cancel each other.
  # These checks scan only the push's own before..after delta, so a cancelled
  # push run loses that delta's coverage for good: push A adds a violation,
  # push B touches an unrelated file and cancels A, and B then scans only its
  # own files while A's remain on the branch, unexamined. pull_request runs
  # scan base..head, which is cumulative, so superseding one loses nothing.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  check-secret-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
      - name: Checkout trusted validator code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || github.event.repository.default_branch }}
          path: trusted-main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check changed files for secret patterns
        shell: bash
        run: |
          set -eo pipefail  # a failed git diff must fail the step, not feed the checker empty stdin
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only -z --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" |
              python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            git diff --name-only -z --diff-filter=ACMR \
              "${{ github.event.merge_group.base_sha }}" \
              "${{ github.event.merge_group.head_sha }}" |
              python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              # New branch: there is no `before` to diff against, but "everything in
              # the repo" is the wrong answer. It re-reports ~55 findings that were
              # already here (minified plugin bundles, clipped articles with embedded
              # map keys) on every branch anyone creates, which is how a gate that
              # caught a real leak gets trained into noise people click past.
              #
              # Scan what the BRANCH introduces: the commits reachable from it and
              # from nothing else, diffed from the parent of the oldest one. A secret
              # pushed straight to a working branch — the leak this trigger was
              # broadened for on 2026-07-02 — is by definition in a file that branch
              # touched, so it is still caught.
              self_local="refs/heads/${GITHUB_REF#refs/heads/}"
              self_remote="refs/remotes/origin/${GITHUB_REF#refs/heads/}"
              # refs/tags is deliberately NOT in this list, and the reason is worth
              # keeping because it looks like an oversight.
              #
              # Everything subtracted here is asserted to be already-scanned history.
              # This workflow triggers on `push.branches`, with no `tags:` filter, so
              # a tag push never runs it — tagged commits have never been scanned by
              # anything. Subtracting them would assert a baseline that does not exist:
              # if a tag points at secret-bearing commit S and a branch adds harmless
              # commit U on top, `rev-list --not <tags>` returns only U, `base` becomes
              # S, and the S..U scan steps right over the secret.
              #
              # Omitting tags costs an over-scan when a branch starts from a tag-only
              # commit: pre-existing history is treated as branch-unique and more files
              # are scanned than necessary. That is noise. Including them costs a miss.
              # For a secret scanner those are not comparable, so this fails toward noise.
              #
              # If tag pushes ever get scanned too, tags become a real baseline and
              # refs/tags can be added back.
              others=$(git for-each-ref --format='%(refname)' refs/heads refs/remotes/origin \
                | grep -vFx "$self_local" | grep -vFx "$self_remote" || true)

              base=""
              if [ -n "$others" ]; then
                # --topo-order, not the default date order: date order carries no
                # topological guarantee, so with skewed timestamps (rebases,
                # cherry-picks preserving original dates) `tail -1` is not certain to
                # be the true root of the branch-unique history. Picking a descendant
                # would set `base` too late and silently omit an earlier commit's
                # files. --topo-order never emits a parent before its children, so the
                # last entry is a real boundary.
                first=$(git rev-list --topo-order "$after" --not $others 2>/dev/null | tail -1)
                if [ -n "$first" ] && git rev-parse -q --verify "${first}^" >/dev/null 2>&1; then
                  base=$(git rev-parse "${first}^")
                fi
              fi

              if [ -n "$base" ]; then
                echo "New branch: scanning $base..$after (files this branch introduces)"
                git diff --name-only -z --diff-filter=ACMR "$base" "$after" |
                  python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
              else
                # Fail closed. If the branch's own commits cannot be isolated (root
                # commit, orphan branch, no other refs fetched), scan everything
                # rather than scan nothing. Worst case is the previous behaviour.
                echo "New branch: cannot isolate branch commits; scanning whole tree."
                git ls-tree -r -z --name-only "$after" |
                  python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
              fi
            else
              git diff --name-only -z --diff-filter=ACMR "$before" "$after" |
                python trusted-main/.github/scripts/check_secret_patterns.py --paths-from-stdin
            fi
          fi
