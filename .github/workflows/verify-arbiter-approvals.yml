name: Verify Arbiter Approvals

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, review_requested, review_request_removed]
  workflow_run:
    workflows: ["Arbiter Sortition"]
    types: [completed]

permissions:
  pull-requests: read
  contents: read

jobs:
  verify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Arbiter Approvals
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/verify_arbiter_approvals.py             --pr-number "$PR_NUMBER"             --repo "$REPO"             --required-count 1