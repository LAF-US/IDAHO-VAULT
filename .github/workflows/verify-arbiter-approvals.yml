name: Verify Arbiter Approvals

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, review_requested, review_request_removed]
  workflow_run:
    workflows: ["Arbiter Sortition"]
    types: [completed]

permissions:
  pull-requests: read
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_run' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Verify Arbiter Approvals
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/verify_arbiter_approvals.py \
            --pr-number "$PR_NUMBER" \
            --repo "$REPO" \
            --required-count 1
