name: Flatten Label Migration — PREVIEW (one-shot)

# Non-destructive entry point for the one-shot risk-vocabulary flatten. Prints the plan
# — which PRs would be re-stamped, which of the 7 retired label definitions would be
# deleted — and writes nothing. Run this first; run the APPLY workflow only once this
# output looks right.
#
# Deliberately parameterless: the mode is the workflow you pick, not a checkbox on a run
# that can also delete labels. Logic lives in flatten-label-migration.yml.
#
# Read-only by construction, not merely by convention: the dry-run path only lists open
# PRs and reads their changed files, so this grants no write scope and does NOT pass the
# MERGE_QUEUE_TOKEN PAT down. The reusable workflow's GH_TOKEN therefore falls back to
# github.token under exactly these permissions — a preview run has no capability to
# create, edit, or delete a label even if a step tried.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  preview:
    uses: ./.github/workflows/flatten-label-migration.yml
    with:
      dry_run: true
    permissions:
      contents: read
      pull-requests: read
