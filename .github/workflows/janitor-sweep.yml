name: Janitor Sweep

on:
  workflow_run:
    workflows:
      - Daily To-Do Rollover
    types:
      - completed

jobs:
  report-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout vault
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Run janitor sweep
        env:
          JANITOR_SLACK_WEBHOOK_URL: ${{ secrets.SWARM_SLACK_WEBHOOK_URL }}
          JANITOR_ALIAS: janitor-bot
        run: |
          python3 .github/scripts/janitor_sweep.py

