name: Janitor Sweep

on:
  workflow_run:
    workflows:
      - Daily To-Do Rollover
    types:
      - completed

jobs:
  report-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Run janitor sweep
        env:
          JANITOR_SLACK_WEBHOOK_URL: ${{ secrets.SWARM_SLACK_WEBHOOK_URL }}
          JANITOR_ALIAS: janitor-bot
        run: |
          python3 .github/scripts/janitor_sweep.py
