name: Wayback Preserve New URLs

on:
  push:
    branches: [main]
    paths:
      - "SOURCES/**"
      - "GOVERNMENTS/**"
      - "TOPICS/**"

jobs:
  preserve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup vault environment
        uses: ./.github/actions/setup-vault

      - name: Preserve new URLs via Save Page Now
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
            git ls-tree -r --name-only "$after" -- '*.md' > /tmp/changed_files.txt
          else
            git diff --name-only "$before" "$after" -- '*.md' > /tmp/changed_files.txt
          fi
          echo "Changed files:"
          cat /tmp/changed_files.txt

          # URL extraction and Save Page Now submission live in wayback_audit.py;
          # this lane reuses them instead of reimplementing in inline bash (#601 item 3).
          python3 .github/scripts/wayback_preserve.py --changed-files /tmp/changed_files.txt

      - name: Commit and Push Changes
        id: commit_push
        run: |
          git add "!/"
          if ! git diff --cached --quiet; then
            BRANCH_NAME="wayback-preserve-$(date -u +%Y%m%d%H%M%S)"
            echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
            git commit -m "wayback preservation log $(date -u +%Y-%m-%d)"
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit"
          fi

      - name: Check for existing PR
        if: steps.commit_push.outputs.has_changes == 'true'
        id: check-pr
        uses: ./.github/actions/idempotent-pr-create
        with:
          branch: ${{ steps.commit_push.outputs.branch_name }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: steps.check-pr.outputs.pr_exists != 'true' && steps.commit_push.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.commit_push.outputs.branch_name }}
        run: |
          gh pr create --title "Automated Wayback Preservation Log" --body "Automated PR from wayback-preserve workflow." --base main --head "$BRANCH_NAME"
