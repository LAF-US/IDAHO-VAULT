name: NETWEB Path Portability Check

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

jobs:
  check-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Checkout trusted validator code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || github.event.repository.default_branch }}
          path: trusted-main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Check for cross-platform path violations
        shell: bash
        run: |
          set -eo pipefail  # a failed git diff must fail the step, not feed the checker empty stdin
          set +H  # Disable bash history expansion (paths contain !)
          VALIDATOR="trusted-main/.github/scripts/check_portable_paths.py"
          if [ ! -f "$VALIDATOR" ]; then
            echo "::notice::Trusted portability helper not present on base yet; using candidate helper for bootstrap."
            VALIDATOR=".github/scripts/check_portable_paths.py"
          fi

          # --diff-filter=ACMRT: check only paths that EXIST in the result
          # (Added/Copied/Modified/Renamed/Type-changed), excluding Deleted (D).
          # A deletion that removes an illegal path must never be blocked by the
          # path guard, or a bad path could never be cleaned up via a PR.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git -c core.quotePath=false diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" |
              python "$VALIDATOR" --paths-from-stdin
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            git -c core.quotePath=false diff --name-only --diff-filter=ACMRT \
              "${{ github.event.merge_group.base_sha }}" \
              "${{ github.event.merge_group.head_sha }}" |
              python "$VALIDATOR" --paths-from-stdin
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              git -c core.quotePath=false ls-tree -r --name-only "$after" |
                python "$VALIDATOR" --paths-from-stdin
            else
              git -c core.quotePath=false diff --name-only --diff-filter=ACMRT "$before" "$after" |
                python "$VALIDATOR" --paths-from-stdin
            fi
          fi

      - name: Check Python automation integrity
        shell: bash
        run: |
          set -eo pipefail  # a failed git diff must fail the step, not feed the checker empty stdin
          INTEGRITY_CHECKER="trusted-main/.github/scripts/check_python_integrity.py"
          if [ ! -f "$INTEGRITY_CHECKER" ]; then
            echo "::notice::Trusted Python integrity helper not present on base yet; using candidate helper for bootstrap."
            INTEGRITY_CHECKER=".github/scripts/check_python_integrity.py"
          fi

          # Same changed-vs-tree split as the portability check above: a PR only
          # gates on the Python files it touches, pre-existing tree debt warns only.
          # --root pins the scan to this job's actual checkout ($GITHUB_WORKSPACE), not
          # wherever the invoked copy of the script happens to live: when the trusted-main
          # copy runs (the normal case once this script exists on main), the script's own
          # default --root (derived from its __file__) resolves to trusted-main/ — the base
          # commit's tree — so it would only ever see pre-existing files and silently miss
          # any violation the PR itself introduces.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git -c core.quotePath=false diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" |
              python "$INTEGRITY_CHECKER" --root "$GITHUB_WORKSPACE" --paths-from-stdin
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            git -c core.quotePath=false diff --name-only --diff-filter=ACMRT \
              "${{ github.event.merge_group.base_sha }}" \
              "${{ github.event.merge_group.head_sha }}" |
              python "$INTEGRITY_CHECKER" --root "$GITHUB_WORKSPACE" --paths-from-stdin
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              git -c core.quotePath=false ls-tree -r --name-only "$after" |
                python "$INTEGRITY_CHECKER" --root "$GITHUB_WORKSPACE" --paths-from-stdin
            else
              git -c core.quotePath=false diff --name-only --diff-filter=ACMRT "$before" "$after" |
                python "$INTEGRITY_CHECKER" --root "$GITHUB_WORKSPACE" --paths-from-stdin
            fi
          fi
