name: Daily To-Do Rollover

on:
  workflow_dispatch:

jobs:
  rollover:
    name: Roll over incomplete to-dos
    runs-on: ubuntu-latest
    concurrency:
      group: daily-rollover-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Run daily rollover
        run: |
          DATE="$(TZ=America/Boise date +%Y-%m-%d)"
          python3 .github/scripts/daily_rollover.py --date "$DATE"

      - name: Publish review branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_DATE="$(TZ=America/Boise date +%Y-%m-%d)"
          BRANCH_NAME="automation/daily-rollover-${TARGET_DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${TARGET_DATE}.md" "TO DO LIST.md"
          if git diff --cached --quiet; then
            echo "No changes to propose"
            exit 0
          fi
          git switch -c "$BRANCH_NAME"
          git commit -m "rollover: carry incomplete to-dos to ${TARGET_DATE}"
          git fetch origin "$BRANCH_NAME" || true
          git push --force-with-lease origin "HEAD:$BRANCH_NAME"
          if ! gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq 'length > 0' | grep -q '^true$'; then
            gh pr create --base main --head "$BRANCH_NAME" --title "rollover: carry incomplete to-dos to ${TARGET_DATE}" --body "Automated daily rollover. Review required before merge."
          fi
