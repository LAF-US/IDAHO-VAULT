name: Looker Walk — read-only PR triage census

# Manually-dispatched, READ-ONLY companion to Layer C (#399). Runs
# `thread_witness.py looker-walk`, which classifies every open PR into
# lanes (clear / machine-disposable / would-cascade / needs-human) plus a stale
# flag and a safe_to_drain verdict, and publishes the JSON triage report to the
# run summary.
#
# This WRITES NOTHING to any PR. It is the "see the classification on real data"
# step that the apply pass (gated `attest-resolve --apply`) was deliberately
# deferred to — not a drive, not the disabled blind reconciler it replaces.
# Re-arming an automatic drive on top of this is a separate, later decision.

on:
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Days of inactivity before a PR is flagged stale"
        required: false
        default: "14"

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  looker-walk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow surfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run read-only triage census
        # Pass all ${{ }} values through env, never interpolated into the run
        # script — stale_days is a user-controllable dispatch input, so direct
        # expansion would be a template-injection vector (zizmor template-injection).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          STALE_DAYS: ${{ github.event.inputs.stale_days || '14' }}
        run: |
          python3 .github/scripts/thread_witness.py looker-walk \
            --owner "$OWNER" \
            --repo "$REPO" \
            --stale-days "$STALE_DAYS" \
            | tee looker-walk.json

      - name: Publish triage census to run summary
        run: |
          {
            echo '## Looker Walk — read-only triage census'
            echo ''
            echo '> Classification only. No threads resolved, no PRs merged.'
            echo ''
            echo '```json'
            jq '{open_prs, by_lane, by_resolution, stale, safe_to_drain}' looker-walk.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Durable surface: render the census to a markdown worklist and upsert it into a
      # persistent issue (reusing issue_reconciler.py — the same find-or-create-by-title
      # pattern agent-review-gate.yml uses). A DISTINCT title from "[PR Loop Watchdog]":
      # issue_reconciler overwrites the body by title, so a shared title would clobber
      # the reconciler's report. Still read-only toward PRs — it writes only this issue,
      # and closes it automatically when no open unresolved threads remain.
      - name: Publish worklist to durable issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/thread_witness.py render-worklist \
            < looker-walk.json > looker-worklist.md
          # Key off lane, not visible unresolved counts: a truncated PR is lane
          # needs-human with maybe 0 visible unresolved threads, but the census cannot
          # prove it clear — closing the issue then would over-claim. (codex on #531.)
          has_findings=$(jq -r '[.reports[] | select(.lane != "clear")] | length > 0' looker-walk.json)
          python3 .github/scripts/issue_reconciler.py \
            --title "[Looker Worklist] Review-thread triage census" \
            --body-file looker-worklist.md \
            --has-findings "$has_findings" \
            --resolved-comment "Resolved automatically: the looker walk found no open unresolved review threads."
