name: Issue Triage

on:
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: withastro/triagebot-action@v1
        with:
          # NOTE: Secret names can be renamed to match existing repository secrets.
          # Current names: BOT_GITHUB_TOKEN, ANTHROPIC_API_KEY
          # Existing alternatives in this repo: GITHUB_TOKEN, MERGE_QUEUE_TOKEN,
          # CLAUDE_APP_PRIVATE_KEY, CODEX_APP_PRIVATE_KEY, MISTRAL_APP_PRIVATE_KEY, OPENCODE_API_KEY
          read-token: ${{ secrets.GITHUB_TOKEN }}
          write-token: ${{ secrets.BOT_GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          triage-skill: .agents/skills/triage
          pr-skill: .agents/skills/pr-writer
          auto-pr-on-fix: false
          bot-logins: ""
          
          # Label customization - using defaults for now
          label-needs-triage: 'triage: needs triage'
          label-not-actionable: 'triage: not actionable'
          label-needs-reproduction: 'triage: needs reproduction'
          label-skipped: 'triage: skipped'
          label-unable-to-reproduce: 'triage: unable to reproduce'
          label-unable-to-fix: 'triage: unable to fix'
          label-failed: 'triage: failed'
          label-fix-pending: 'triage: fix pending'
          label-fix-rejected: 'triage: fix rejected'
          label-fix-verified: 'triage: fix verified'
          pr-label-fix-verified: 'fix verified'
