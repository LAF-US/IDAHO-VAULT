name: Agent Swarm Signing Proof — codex

# Dispatch-only entry point for the codex lane of the signing-gate proof. Deliberately
# parameterless: the lane is the workflow you pick, not a workflow_dispatch input. Logic
# lives in agent-swarm-signing-proof.yml.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  proof:
    uses: ./.github/workflows/agent-swarm-signing-proof.yml
    with:
      agent: codex
    permissions:
      contents: read
      issues: write
    secrets:
      CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
