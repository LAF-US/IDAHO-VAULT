name: Auto PR for Agent Branches

on: [create, workflow_dispatch]

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Gate on supported branch events
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_TYPE: ${{ github.event.ref_type }}
          EVENT_REF: ${{ github.event.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "create" ]; then
            if [ "$EVENT_REF_TYPE" != "branch" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BRANCH_NAME="$EVENT_REF"
          else
            BRANCH_NAME="$CURRENT_REF_NAME"
          fi

          case "$BRANCH_NAME" in
            claude/*|codex/*|gemini/*|copilot/*|perplexity/*|grok/*|serena/*)
              if ! [[ "$BRANCH_NAME" =~ ^[A-Za-z0-9._/-]+$ ]]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout repo
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ steps.gate.outputs.branch_name }}

      - name: Checkout trusted automation scripts
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-main

      - name: Get changed files and classify
        if: steps.gate.outputs.skip != 'true'
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if ! git merge-base origin/main HEAD >/dev/null 2>&1; then
            echo "No merge base with origin/main; skipping auto-PR for history-rewrite branch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Auto PR skipped"
              echo
              echo "Branch has no merge base with \`origin/main\`; treating this as a history-rewrite branch."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CHANGED=$(git diff --name-only origin/main...HEAD)
          if [ -z "$CHANGED" ]; then
            echo "No changes vs main"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          RESULT=$(echo "$CHANGED" | python3 trusted-main/.github/scripts/classify_paths.py)
          TIER=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['tier'])")
          # tier4 is the 4-state cell (clear|low|med|high). The binary `tier` collapses the
          # `—/—` clear cell down to `low`, so the clear cell is only visible on tier4 — the
          # producer needs it to stamp the positive `risk/—` marker (K3/#629, K4/#630).
          TIER4=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['tier4'])")
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "tier4=$TIER4" >> "$GITHUB_OUTPUT"

          echo "### Changed files" >> "$GITHUB_STEP_SUMMARY"
          echo "$CHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo "### Risk tier: $TIER (cell: $TIER4)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check for existing PR
        if: steps.gate.outputs.skip != 'true' && steps.classify.outputs.skip != 'true'
        id: check-pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.gate.outputs.branch_name }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$PR_NUMBER" ]; then
            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure labels exist
        if: steps.gate.outputs.skip != 'true' && steps.classify.outputs.skip != 'true' && steps.check-pr.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 trusted-main/.github/scripts/review_feedback_loop.py ensure-labels
          python3 trusted-main/.github/scripts/pr_lifecycle.py ensure-labels

      - name: Create PR
        if: steps.gate.outputs.skip != 'true' && steps.classify.outputs.skip != 'true' && steps.check-pr.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RISK_TIER: ${{ steps.classify.outputs.tier }}
          RISK_TIER4: ${{ steps.classify.outputs.tier4 }}
          BRANCH_NAME: ${{ steps.gate.outputs.branch_name }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE_BARE=$(echo "$BRANCH_NAME" | sed 's|^[^/]*/||')
          LAST_SEG=$(echo "$TITLE_BARE" | sed 's|^.*-||')
          if [[ "$LAST_SEG" =~ [A-Z0-9] ]]; then
            TITLE=$(echo "$TITLE_BARE" | sed 's|-[^-]*$||' | tr '-' ' ')
          else
            TITLE=$(echo "$TITLE_BARE" | tr '-' ' ')
          fi

          AGENT=$(echo "$BRANCH_NAME" | sed 's|/.*||')
          DIFFSTAT=$(git diff --stat origin/main...HEAD)

          # Risk label: the `—/—` clear cell gets the POSITIVE `risk/—` marker (K3/#629,
          # K4/#630) — the only state that arms auto-merge on open, mutually exclusive with
          # every risk/* flag, and carrying NO review/pending (a clear PR is not held for
          # review). Every other cell keeps the binary risk/{low,high} flag; low still carries
          # review/pending so the machine-doc cell is held for a human.
          if [ "$RISK_TIER4" = "clear" ]; then
            RISK_LABEL="risk/—"
            LABEL=""
            LABEL_MARKER="risk/—"
          elif [ "$RISK_TIER" = "low" ]; then
            RISK_LABEL="risk/$RISK_TIER"
            LABEL="review/pending"
            LABEL_MARKER="$LABEL"
          else
            RISK_LABEL="risk/$RISK_TIER"
            LABEL=""
            LABEL_MARKER="none"
          fi

          BODY=$(
            printf '%s\n' \
              "## Auto-generated PR" \
              "" \
              "**Agent:** \`$AGENT\`" \
              "**Lifecycle:** \`staged\`" \
              "**Label:** \`$LABEL_MARKER\`" \
              "" \
              "### Diff stat" \
              "\`\`\`" \
              "$DIFFSTAT" \
              "\`\`\`" \
              "" \
              "---" \
              "*Created by auto-pr workflow*"
          )

          CREATE_ARGS=(
            --title "$TITLE"
            --body "$BODY"
            --base main
            --head "$BRANCH_NAME"
            --label "$RISK_LABEL"
          )
          if [ -n "$LABEL" ]; then
            CREATE_ARGS+=(--label "$LABEL")
          fi

          # Idempotent create: the `create` branch event races against a PR the
          # agent opens by hand (MCP / `gh`) moments later, so the earlier
          # "Check for existing PR" step can pass while the PR is created in the
          # window before this step runs. In that case `gh pr create` exits 1
          # with "a pull request for branch ... already exists" — which is a
          # benign no-op, not a failure. Swallow only that specific outcome;
          # every other error still fails the step.
          if ! out=$(gh pr create "${CREATE_ARGS[@]}" 2>&1); then
            # Match the specific gh duplicate-PR message
            # ("a pull request for branch \"X\" into branch \"main\" already
            # exists: …"), requiring BOTH phrases so an unrelated failure that
            # merely contains "already exists" is never mistaken for the no-op.
            if printf '%s' "$out" | grep -qiF 'a pull request for branch' \
               && printf '%s' "$out" | grep -qiF 'already exists'; then
              echo "A PR for '$BRANCH_NAME' already exists — nothing to create (raced with manual/MCP PR creation). Treating as success."
              printf '%s\n' "$out"
              exit 0
            fi
            printf '%s\n' "$out" >&2
            exit 1
          fi
          printf '%s\n' "$out"

      - name: Mark PR lifecycle as staged
        if: steps.gate.outputs.skip != 'true' && steps.classify.outputs.skip != 'true' && steps.check-pr.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.gate.outputs.branch_name }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUM=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$PR_NUM" ] || ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "No open PR found to mark lifecycle state on"
            exit 0
          fi
          python3 trusted-main/.github/scripts/pr_lifecycle.py set-state --pr-number "$PR_NUM" --state staged

      - name: Log grace period start
        # Only the true machine-doc low cell (tier4 == 'low') carries review/pending. The
        # binary tier collapses the clear cell to 'low' too, so gate on tier4 to avoid
        # claiming review/pending on a clear PR that was actually stamped `risk/—`.
        if: steps.gate.outputs.skip != 'true' && steps.classify.outputs.skip != 'true' && steps.check-pr.outputs.pr_exists != 'true' && steps.classify.outputs.tier4 == 'low'
        shell: bash
        run: |
          echo "Lifecycle set to \`lifecycle/staged\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Low-risk PR created with \`review/pending\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Agent-authored PRs remain reviewable and require an explicit merge decision." >> "$GITHUB_STEP_SUMMARY"

      - name: Log clear-cell auto-merge
        # The —/— clear cell is armed for auto-merge on open (K3/#629, K4/#630).
        if: steps.gate.outputs.skip != 'true' && steps.classify.outputs.skip != 'true' && steps.check-pr.outputs.pr_exists != 'true' && steps.classify.outputs.tier4 == 'clear'
        shell: bash
        run: |
          echo "Lifecycle set to \`lifecycle/staged\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Clear cell (\`—/—\`): stamped \`risk/—\` and armed for auto-merge on open." >> "$GITHUB_STEP_SUMMARY"
