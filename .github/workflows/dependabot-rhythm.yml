name: Dependabot Rhythm

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge-low-risk:
    permissions:
      contents: write
      pull-requests: write
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
