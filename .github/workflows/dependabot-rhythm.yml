name: Dependabot Rhythm

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-low-risk:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@ffa630c65fa7e0ecfa0625b5ceda64399aea1b36 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize decision
        run: |
          {
            echo "## Dependabot Rhythm"
            echo ""
            echo "- Ecosystem: \`${{ steps.metadata.outputs.package-ecosystem }}\`"
            echo "- Update type: \`${{ steps.metadata.outputs.update-type }}\`"
            echo "- Dependency names: \`${{ steps.metadata.outputs.dependency-names }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Approve and enable auto-merge
        if: |
          (steps.metadata.outputs.package-ecosystem == 'pip' || steps.metadata.outputs.package-ecosystem == 'uv' || steps.metadata.outputs.package-ecosystem == 'github-actions' || steps.metadata.outputs.package-ecosystem == 'github_actions') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Race-tolerant merge for unprotected `main`. The historical failure mode
          # ([[idaho-vault-race-conditions]]) is that Dependabot opens a batch and
          # each rhythm job races to merge — losers die with "Base branch was modified".
          # Strategy: try a direct squash merge with a short retry loop. Treat the
          # race error as transient (re-fetch and retry); fail loudly on anything else.
          gh pr review --approve "$PR_URL" || true
          for attempt in 1 2 3 4 5; do
            if out=$(gh pr merge --squash --delete-branch "$PR_URL" 2>&1); then
              echo "$out"
              echo "::notice::merged on attempt $attempt"
              exit 0
            fi
            echo "$out"
            if echo "$out" | grep -qiE "Base branch was modified|mergePullRequest|not in a mergeable state"; then
              echo "::notice::attempt $attempt raced/unstable; sleeping then retrying"
              sleep $((attempt * 15))
              continue
            fi
            echo "::error::gh pr merge failed for unexpected reason"
            exit 1
          done
          echo "::warning::merge did not complete after retries; reaper will sweep this PR"
          exit 0

