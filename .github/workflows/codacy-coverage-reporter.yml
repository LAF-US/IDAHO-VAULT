# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Runs the same test suite python-test-suite.yml runs, under `coverage`, and
# uploads the resulting report to Codacy so coverage is tracked in the Codacy
# UI / PR checks. Kept as its own workflow (rather than a step bolted onto
# python-test-suite.yml) to mirror codacy.yml's separation of concerns and
# Codacy's own documented convention for this action:
# https://github.com/codacy/codacy-coverage-reporter-action
#
# The report-generation and upload steps run whenever the test step was
# actually reached (pass or fail) -- via `id: tests` +
# `!cancelled() && steps.tests.conclusion != 'skipped'` -- so a coverage
# number still gets reported even on a run where a test failed (coverage
# trend tracking is independent of pass/fail, and a red test run losing its
# coverage data too would make the Codacy history gappy for no reason), but
# NOT when the workflow is cancelled or a prior setup step (checkout, uv
# sync) failed and the test step never ran at all -- avoids a confusing
# cascading failure from `coverage xml`/the upload trying to run against an
# environment or coverage data that was never produced.

name: Codacy Coverage Reporter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

      - name: uv sync (installs pyproject + dev group per uv.lock)
        run: uv sync

      - name: Run test suite under coverage
        id: tests
        run: uv run coverage run -m unittest discover -s tests -p "test_*.py" -v

      - name: Generate coverage XML report
        if: ${{ !cancelled() && steps.tests.conclusion != 'skipped' }}
        run: uv run coverage xml

      # Uploads with a pinned, checksum-verified reporter binary instead of
      # codacy/codacy-coverage-reporter-action: that action pipes an
      # unpinned `master` get.sh from raw.githubusercontent.com straight
      # into bash at runtime (twice), a supply-chain hole the org Actions
      # pin policy cannot see because it sits inside the composite action's
      # run step rather than a `uses:` reference. Same remediation pattern
      # as codacy.yml. The expected SHA-512 is Codacy's own published
      # checksum for reporter 14.1.3, as printed by get.sh in this repo's
      # CI logs (run 30056985325). The token travels only as the
      # CODACY_PROJECT_TOKEN env var, which the reporter reads natively.
      # A single report needs no --partial/final pair.
      - name: Upload coverage to Codacy
        if: ${{ !cancelled() && steps.tests.conclusion != 'skipped' }}
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          REPORTER_VERSION: "14.1.3"
          REPORTER_SHA512: "73a6c93fc5db509fd0423d6e545759c3f61d8360ee12054e32a9277daab6add0da6c6639248f6ed6c0042366440293ebc0b6144325aef52c5d3d4b230d65eb17"
        shell: bash
        run: |
          curl -fsSL "https://artifacts.codacy.com/bin/codacy-coverage-reporter/${REPORTER_VERSION}/codacy-coverage-reporter-linux" -o codacy-coverage-reporter
          echo "${REPORTER_SHA512}  codacy-coverage-reporter" | sha512sum -c -
          chmod +x codacy-coverage-reporter
          ./codacy-coverage-reporter report -r coverage.xml
