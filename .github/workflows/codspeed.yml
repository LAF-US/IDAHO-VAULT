name: CodSpeed

# Continuous performance measurement for the vault's automation guards.
#
# The benchmarks under tests/benchmarks/ exercise the pure, hot inner loops of
# the policy checkers that run on every pull request (path classification,
# portability and secret scanning, tag normalization) plus the operator-context
# loader. They are measured in CPU simulation mode, so results are
# hardware-agnostic and comparable across runs.
#
# No secrets: authentication with CodSpeed uses OpenID Connect, which is why the
# job requests `id-token: write`.

on:
  push:
    branches: [main]
  pull_request:
  # `workflow_dispatch` lets CodSpeed trigger a backtest run to seed baseline data.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with CodSpeed
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install project and benchmark dependencies
        run: uv sync --locked

      - name: Run benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation
          run: uv run pytest tests/ --codspeed
