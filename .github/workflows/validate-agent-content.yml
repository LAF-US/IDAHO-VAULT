name: Validate Agent Content

on:
  push:
    branches:
      - "agent/**"

jobs:
  validate:
    name: Validate markdown content on agent branches
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run content validation
        shell: bash
        run: |
          set -eo pipefail  # a failed git diff must fail the step, not feed the validator empty stdin
          # Diff the whole push (not just its last commit) against known-good SHAs from the
          # push event -- github.event.before/github.sha, never attacker-shaped -- mirroring
          # check-portable-paths.yml. --diff-filter=ACMRD (not the portability checks' ACMRT)
          # deliberately keeps Deleted paths in: validate_content.py's own deletion guard
          # depends on seeing them.
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
            git -c core.quotePath=false ls-tree -r --name-only "$after" |
              python3 .github/scripts/validate_content.py --paths-from-stdin
          else
            git -c core.quotePath=false diff --name-only --diff-filter=ACMRD "$before" "$after" |
              python3 .github/scripts/validate_content.py --paths-from-stdin
          fi
