name: Cross-Platform Smoke

# Smoke test that core runtime/governance surfaces load identically on
# ubuntu / macos / windows runners. Complements the MESHNETWEB portability
# script in .github/scripts/meshnetweb_portability_check.py — report-first
# on push/dispatch, strict on pull_request.
#
# Recovered from #310 (closed 2026-05-22) with start_SPARKSEED.py references
# dropped per current AGENTS.md doctrine ("Startup is OS-agnostic. No local
# Bash, WSL, Sparkseed, or launcher execution is required").

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Supersede, don't stack: a second push to the same branch cancels the still-running
# check for the previous commit, which nobody is waiting on. The final state of the
# branch is still checked in full, so no coverage is lost.
#
# `github.event_name` is in the group key on purpose: it keeps the push-event run and
# the pull_request-event run of the same branch in SEPARATE groups. Collapsing them
# would let a push run cancel a required PR check, and a cancelled required check
# blocks the PR.
#
# merge_group is never cancelled — cancelling a merge-queue check breaks the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      # A repo-root file named after a standard-library module (importlib.py,
      # types.py, json.py ...) is imported *before* the stdlib, because Python
      # puts the working directory first on sys.path. Every `python -m ...`
      # below then dies during interpreter startup with a traceback that names
      # runpy and never names the real culprit.
      #
      # The probe runs with its cwd OUTSIDE the checkout, so it still works
      # when the shadowing has already broken Python inside the checkout.
      - name: Guard — no stdlib shadowing at repo root
        shell: bash
        run: |
          repo="$PWD"
          shadowed=$(cd "$RUNNER_TEMP" && python -c '
          import pathlib, sys
          repo = pathlib.Path(sys.argv[1])
          names = set(sys.stdlib_module_names)
          hits = []
          for p in sorted(repo.iterdir()):
              if not p.is_file() or p.suffix != ".py":
                  continue
              # "importlib (2).py" shadows nothing by itself, but it is the
              # same debris and the copy without the suffix does shadow.
              stem = p.stem.split(" (")[0].strip()
              if stem in names:
                  hits.append(p.name)
          print("\n".join(hits))
          ' "$repo")
          if [ -n "$shadowed" ]; then
            echo "Repo-root files shadow Python standard-library modules:"
            printf '%s\n' "$shadowed" | sed 's/^/    /'
            echo
            echo "Python resolves these before the stdlib whenever an agent or"
            echo "workflow runs from the repository root, which breaks every"
            echo "'python -m ...' invocation. Move or delete them."
            exit 1
          fi
          echo "No stdlib shadowing at repo root."

      # Startup surfaces are checked by *reachability*, not against one
      # hard-coded path. A surface may sit at its canonical path, at its
      # NETWEB `_PREFIX` alias (VAULT-CONVENTIONS § Portable Path Standard),
      # or be relocated by the Architect — none of which is a failure. What is
      # a failure is a surface that cannot be found anywhere. Every surface is
      # checked and every result printed, so the log names what is wrong
      # instead of exiting silently on the first `test -f`.
      - name: Verify startup surfaces are reachable
        shell: bash
        run: |
          missing=0
          require_any() {
            label="$1"; shift
            for candidate in "$@"; do
              if [ -f "$candidate" ]; then
                printf '  ok       %-14s -> %s\n' "$label" "$candidate"
                return 0
              fi
            done
            printf '  MISSING  %-14s   looked for: %s\n' "$label" "$*"
            missing=1
            return 0
          }

          echo "Startup surfaces:"
          require_any AGENTS      "AGENTS.md"
          require_any WAKEUP      "!/WAKEUP.md"  "!-WAKEUP.md"  "WAKEUP.md"
          require_any NEST-README "!/README.md"  "!-README.md"  "!README.md"
          require_any swarm       "swarm.json"

          if [ "$missing" -ne 0 ]; then
            echo
            echo "A startup surface was not found at any known path."
            echo "If it was moved deliberately, add the new path to the"
            echo "matching require_any line above — this check is a map of"
            echo "where the surfaces live, not a claim that they cannot move."
            exit 1
          fi

      # Output goes to the runner temp dir; this step used to leave a
      # swarm.pretty.json behind in the working tree on every run.
      - name: Validate swarm.json
        shell: bash
        run: python -m json.tool swarm.json > "$RUNNER_TEMP/swarm.pretty.json"

      - name: MESHNETWEB portability check (report)
        run: python .github/scripts/meshnetweb_portability_check.py

      - name: Codex work surface guard
        run: python .github/scripts/codex_work_guard.py

      - name: MESHNETWEB portability check (strict on PR)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: python .github/scripts/meshnetweb_portability_check.py --strict
