name: PR-Agent

# Self-hosted PR-Agent (OSS) — augments the hosted Qodo app (#675).
# Describes/reviews PRs and answers slash-commands using the vault's OWN LLM key
# (OpenRouter, fetched from 1Password at runtime). Review config lives in
# `.pr_agent.toml`.
#
# Qodo donated PR-Agent to the community: the project now lives at
# `the-pr-agent/pr-agent` (docs.pr-agent.ai), not `qodo-ai/pr-agent`. Qodo's
# commercial line continued separately as Qodo 2.0, so the hosted app this
# augments and the OSS action below are no longer the same codebase.
#
# ┌─ STATUS: SCAFFOLDING — inert (job SKIPPED) until the switch below is on ─Ŀ
# │ 0. MASTER SWITCH: set repo variable PR_AGENT_ENABLED = 'true'. Until then  │
# │    the job skips cleanly (no run, no red on other PRs). Flip LAST.         │
# │ 1. DONE — vendored at v0.42.0 (f6af7d77); Dependabot bumped main from      │
# │    v0.41.1 and the 2026-08-14 merge took that version. Same wiring and     │
# │    the same image digest as v0.41.1 — verified, not assumed.               │
# │ 2. Set the OpenRouter 1Password ref (`OPENROUTER_API_KEY` op:// below) to  │
# │    the real item, and confirm OP_SERVICE_ACCOUNT_TOKEN can read it.        │
# │    (see `.op/openrouter.env.template`)                                     │
# │ 3. DONE — key form corrected against the pinned source. See the env block. │
# │ 4. DONE — a repo SHA does not pin the code that runs: upstream's           │
# │    action.yaml builds `FROM pragent/pr-agent:github_action`, a MUTABLE     │
# │    tag. Now runs `./.github/actions/pr-agent` — that same action.yaml,     │
# │    image pinned by digest, and check_action_pins.py now checks `image:`    │
# │    lines so the digest is enforced. Still costs Dependabot tracking:       │
# │    the version is manual. Read that file's header before bumping.          │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Augment, don't replace: this runs ALONGSIDE the hosted Qodo app. Once it is
# proven to review reliably, retire the hosted app separately (do not cut Qodo
# before PR-Agent is confirmed working, or coverage drops to zero).

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    # MASTER SWITCH: stays inert (job SKIPPED — no action resolution, no red)
    # until the repo variable PR_AGENT_ENABLED is set to 'true'. Flip it only
    # after the SHA pin + OpenRouter secret ref are in place, or this errors on
    # every PR repo-wide (the opencode.yml failure mode).
    #
    # PR events run unrestricted (reviewing bot-authored PRs is intentional per
    # .pr_agent.toml `ignore_pr_author_bot = false`).
    #
    # Comment events are gated harder. This is a PUBLIC repo, and a slash-command
    # run spends the OpenRouter credential and posts with a write-capable token,
    # so without an author gate any outside account could drain the key and speak
    # as the bot by commenting `/review` (or editing a comment, since `edited`
    # fires too). Trust set mirrors TRUSTED_COMMENT_ASSOCIATIONS in
    # .github/scripts/review_feedback_loop.py, which defaults to the same three.
    # The non-bot check stays so the agent's own replies can't loop.
    if: >
      vars.PR_AGENT_ENABLED == 'true' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         github.event.sender.type != 'Bot' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                  github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      # A local `./` action has to exist on disk, so this job now needs a
      # a checkout it never needed while `uses:` pointed at a remote repo.
      #
      # It must be the BASE revision, not the default merge ref. On
      # `pull_request` the merge ref contains the contributor's changes — and
      # this is a PUBLIC repo, so a fork could rewrite
      # `.github/actions/pr-agent/action.yml` and the step below would hand its
      # own container the OpenRouter key and a write-capable token. Checking out
      # base means the action that runs is the one already reviewed and merged.
      #
      # PR-Agent reads the diff through the GitHub API, not the working tree, so
      # it loses nothing by not having the PR's files on disk.
      - name: Check out the trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both arms are immutable SHAs. The fallback was the default-branch
          # NAME, which is a moving target: an `issue_comment` run would check
          # out whatever that branch pointed at when the step executed, not the
          # revision the event fired against, so "the action that runs is the
          # one already reviewed and merged" was not actually guaranteed. On
          # every non-`pull_request` trigger here, github.sha IS the default
          # branch's head at event time.
          ref: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.sha }}
          # The third-party container inherits the workspace; don't leave a
          # usable credential in .git/config for it.
          persist-credentials: false

      - name: Load OpenRouter key from 1Password
        id: op
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v4
        with:
          export-env: true
        env:
          # TODO(logan): confirm the exact op:// ref for the OpenRouter API key
          # (placeholder namespace mirrors 1password-secret-template.yml).
          OPENROUTER_API_KEY: op://vault-operations/openrouter-api-key/credential

      - name: Skip when 1Password token is missing
        if: env.OP_SERVICE_ACCOUNT_TOKEN == ''
        run: |
          echo "::warning::OP_SERVICE_ACCOUNT_TOKEN not set — PR-Agent has no LLM key; skipping."

      - name: Run PR-Agent
        if: env.OPENROUTER_API_KEY != ''
        # Local action, NOT `the-pr-agent/pr-agent@<sha>` directly. Upstream's
        # action.yaml builds a one-line Dockerfile that is `FROM
        # pragent/pr-agent:github_action` — a mutable tag, so the repo SHA pin
        # did not pin the running code. `.github/actions/pr-agent/action.yml`
        # is upstream's action.yaml at f6af7d77 (v0.42.0) with the image pinned by
        # digest instead; read its header before bumping.
        #
        # Dependabot no longer tracks this. It watched the `uses:` ref and its
        # trailing version marker; a `./` ref is not tracked, and there is
        # no `docker` ecosystem in .github/dependabot.yml. Version and digest
        # are both manual now — the local action's header says how to refresh.
        uses: ./.github/actions/pr-agent # the-pr-agent/pr-agent v0.42.0 (f6af7d77)
        env:
          # Job-level env reaches every step, and a Docker action receives the
          # step's env inside the container — so without this the 1Password
          # service-account token would be handed to third-party code that has
          # no use for it. Blanked here only; the guard and load steps above
          # still read the job-level value.
          OP_SERVICE_ACCOUNT_TOKEN: ''
          # `OPENAI_KEY` — single underscore. `run_action` in
          # pr_agent/servers/github_action_runner.py:87 reads
          # `OPENAI_KEY` or `OPENAI.KEY` and nothing else; the nested
          # `OPENAI__KEY` form used here before is never checked there.
          #
          # WARNING: when the key is absent the runner prints "OPENAI_KEY not
          # set" and CONTINUES (it allows non-OpenAI providers), so a wrong key
          # name yields a silent no-op review rather than a failed check.
          # Confirm the first enabled run actually posts before trusting it.
          OPENAI_KEY: ${{ env.OPENROUTER_API_KEY }}
          # No explicit handling in the runner; these reach Dynaconf's env
          # loader, which maps `SECTION__KEY` to `section.key`.
          OPENAI__API_BASE: https://openrouter.ai/api/v1
          CONFIG__MODEL: openrouter/auto
          CONFIG__GIT_PROVIDER: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
