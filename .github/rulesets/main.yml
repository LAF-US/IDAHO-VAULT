name: Main Ruleset

description: Primary repository rules for IDAHO-VAULT

target: branch

enforcement: active

conditions:
  ref_name:
    include: ["main"]
    exclude: []

rules:
  - type: pull_request
    name: Prevent stale review dismissal
    parameters:
      dismiss_stale_reviews_on_push: false
      require_code_owner_review: false
      require_last_push_approval: false
      required_approving_review_count: 0
      required_review_thread_resolution: false
