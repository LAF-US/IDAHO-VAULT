---
# Best-effort mitigation for the Codacy Security Scan crash tracked in
# GitHub #822 / Linear LAF-72 (opened 2026-07-08) and re-confirmed at 100%
# failure in !/AUDIT-CI-FAILURE-SWEEP-2026-08-10.md.
#
# Root cause (confirmed via job logs, run 31359405240): the CLI throws
# java.nio.charset.MalformedInputException at Sarif.scala:149 while doing
# Files.readAllLines(UTF-8) on "a matched issue's source file", then hangs
# until .github/workflows/codacy.yml's 25-minute timeout kills it. The CLI
# never logs which file it was reading when it throws, so the exact
# trigger is NOT confirmed — this session has no Docker daemon available
# to reproduce and pin it down directly (`docker info` fails: no socket).
#
# What IS confirmed: these are the repo's only git-tracked files that
# fail a strict UTF-8 decode (found via a full `git ls-files` sweep,
# 38,421 files checked). None of them are source code Codacy should be
# analyzing — they're binaries, backups, and stray temp files. Excluding
# them is a reasonable, low-risk mitigation attempt regardless of which
# one (if any) is the actual trigger, since none belong in a security
# scan's scope either way.
#
# UPDATE (same day): this did NOT fix the crash. Re-ran with this file in
# place — identical crash, identical timeout. The verbose CLI log shows it
# fetched its configuration from Codacy's remote API
# ("/project/analysis/configuration"), not from this file — CODACY_PROJECT_TOKEN
# being set appears to make the CLI prefer remote (dashboard-driven) config
# over a local .codacy.yml. This file is very likely inert as shipped. Left
# in place as a documented, correct starting point (real next step is either
# Codacy dashboard access to configure "Ignored files" there, or finding a
# way to make the CLI use local config instead of remote — neither was
# achieved in this session). See !/AUDIT-CI-FAILURE-SWEEP-2026-08-10.md,
# Incident A, for the full trail.
#
# The "disables the web UI's Ignored files" warning below turned out to be
# backwards for this run — remote config took priority over this file, not
# the other way around. Left for context, not asserted as fact anymore.
#
# IMPORTANT: per Codacy's own docs, adding this file is DOCUMENTED to mean
# "Ignored files" configured through the Codacy web UI stop applying — but
# that didn't match what was observed here. Whoever has Codacy dashboard
# access should check directly rather than trust either claim.
exclude_paths:
  - ".serena/**"
  - "backup-compare-temp/**"
  - "storage/**"
  - "LUMO_saint-blue-in-the-desert_20260518.rtfd/**"
  - "="
  - "IMG_20260203_102718.dng"
  - "IdahoPTV-PBS KAID letterhead.dotx"
  - "QDrive IDEX Series Templates.download"
  - "SCRATCH.prin"
  - "backup-diff.log"
  - "context.mdb"
  - "draft Metadata Flowchart 4-7.pub"
  - "io5ujgpo.a4y"
  - "wrvjr3p2.ky4"
  - "xmlh0dpb.gri"
  - "**/minidata*.csv"
