version: 2
updates:
  # Python (pip) ecosystem intentionally absent. requirements.txt is a resolved
  # lockfile generated by .github/workflows/sync-dependencies.yml from
  # pyproject.toml. Leaf-bumping by Dependabot creates unresolvable trees when
  # consumer pins (e.g. crewai pins click~=8.1.7 and mcp~=1.26.0) and lockstep
  # families (opentelemetry-*) reject individual upgrades. Python transitive
  # updates flow via sync-dependencies's weekly cron + on-push trigger.
  # See memory: idaho_vault_dep_drift_pattern.md for full rationale.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
