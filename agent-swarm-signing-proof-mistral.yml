name: Agent Swarm Signing Proof — mistral

# Dispatch-only entry point for the mistral lane of the signing-gate proof. Deliberately
# parameterless: the lane is the workflow you pick, not a workflow_dispatch input. Logic
# lives in agent-swarm-signing-proof.yml.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  proof:
    uses: ./.github/workflows/agent-swarm-signing-proof.yml
    with:
      agent: mistral
    permissions:
      contents: read
      issues: write
    secrets:
      MISTRAL_APP_PRIVATE_KEY: ${{ secrets.MISTRAL_APP_PRIVATE_KEY }}
