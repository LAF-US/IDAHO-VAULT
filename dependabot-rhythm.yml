name: Dependabot Rhythm

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge-low-risk:
    permissions:
      contents: write
      pull-requests: write
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.base.ref == 'main' &&
      !contains(github.event.pull_request.labels.*.name, 'risk/high')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize decision
        run: |
          {
            echo "## Dependabot Rhythm"
            echo ""
            echo "- Ecosystem: \`${{ steps.metadata.outputs.package-ecosystem }}\`"
            echo "- Update type: \`${{ steps.metadata.outputs.update-type }}\`"
            echo "- Dependency names: \`${{ steps.metadata.outputs.dependency-names }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exclude protected live surfaces from automatic merge
        id: scope
        if: |
          (steps.metadata.outputs.package-ecosystem == 'pip' || steps.metadata.outputs.package-ecosystem == 'uv' || steps.metadata.outputs.package-ecosystem == 'github-actions' || steps.metadata.outputs.package-ecosystem == 'github_actions') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          eligible=true
          # Fail closed: if the file list cannot be fetched (auth, network,
          # rate limit), refuse rather than skip the protected-path check.
          # Matches the maintainer lane in auto-merge-rhythm.yml.
          if ! files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"; then
            echo "::error::Unable to list PR files; refusing to enable auto-merge."
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|.github/scripts/*|.codex/*|.openclaw/*|AGENTS.md|CONSTITUTION.md|DECISIONS.md|VAULT-CONVENTIONS.md|swarm.json|!/*)
                echo "::notice::Manual review required for protected path '$path'."
                eligible=false
                ;;
            esac
          done <<< "$files"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Verify protected required checks exist
        if: |
          (steps.metadata.outputs.package-ecosystem == 'pip' || steps.metadata.outputs.package-ecosystem == 'uv' || steps.metadata.outputs.package-ecosystem == 'github-actions' || steps.metadata.outputs.package-ecosystem == 'github_actions') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The four policy checks must have PASSED on this PR (existence + success) — decoupled
          # from whether they're required-for-merge in the ruleset. This step runs early (on
          # pull_request_target) and there is no check-completion re-trigger, so POLL until each
          # check-run is completed (they run on every pull_request and finish fast), then require
          # success. A check that's pending/absent is waited on, not failed-closed; only a real
          # non-success or the timeout blocks arming.
          contexts="check-secret-patterns check-large-files check-paths check-dotfolder-anchors"
          deadline=$(( $(date +%s) + 900 ))   # 15-minute budget
          while :; do
            # Fail closed on a real API error rather than letting an empty result
            # masquerade as "still pending" and surface a misleading timeout.
            if ! runs="$(gh api --paginate "repos/$GH_REPO/commits/$HEAD_SHA/check-runs" --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion)"')"; then
              echo "::error::Unable to fetch check-runs for $HEAD_SHA (auth/rate-limit/network); refusing to enable auto-merge."
              exit 1
            fi
            pending=""
            for c in $contexts; do
              line="$(printf '%s\n' "$runs" | awk -F'\t' -v c="$c" '$1==c{print; exit}')"
              st="$(printf '%s' "$line" | cut -f2)"
              { [ -z "$line" ] || [ "$st" != "completed" ]; } && pending="$pending $c"
            done
            [ -z "$pending" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Dependabot auto-merge gate: policy checks did not complete in time:$pending"
              exit 1
            fi
            echo "Waiting for policy checks to complete:$pending"
            sleep 20
          done
          for c in $contexts; do
            concl="$(printf '%s\n' "$runs" | awk -F'\t' -v c="$c" '$1==c{print $3; exit}')"
            if [ "$concl" != "success" ]; then
              echo "::error::Dependabot auto-merge is disabled until '$c' passes on this PR (got: ${concl:-missing})."
              exit 1
            fi
          done

      - name: Enable verified auto-merge
        if: |
          (steps.metadata.outputs.package-ecosystem == 'pip' || steps.metadata.outputs.package-ecosystem == 'uv' || steps.metadata.outputs.package-ecosystem == 'github-actions' || steps.metadata.outputs.package-ecosystem == 'github_actions') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash "$PR_URL"

  disable-high-risk-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'risk/high')
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when high-risk labeling is present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --disable-auto "$PR_URL" || true
          echo "::notice::Dependabot automatic merge is blocked because risk/high is present."
