name: Agent Swarm Signing Proof — opencode

# Dispatch-only entry point for the opencode lane of the signing-gate proof. Deliberately
# parameterless: the lane is the workflow you pick, not a workflow_dispatch input. Logic
# lives in agent-swarm-signing-proof.yml.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  proof:
    uses: ./.github/workflows/agent-swarm-signing-proof.yml
    with:
      agent: opencode
    permissions:
      contents: read
      issues: write
    secrets:
      OPENCODE_AGENT_PRIVATE_KEY: ${{ secrets.OPENCODE_AGENT_PRIVATE_KEY }}
