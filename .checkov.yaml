# Checkov — Codacy toggle. `skip-check: []` suppresses nothing, and keeps the
# file a valid mapping.
#
# The only surface here is .github/workflows/, already guarded twice: by
# action-pin-policy.yml and by CodeQL's `actions` analysis. When the three
# disagree, the repo's own policy workflow wins — it is the one that gates
# merges.
#
# `check:` is exclusive, not additive: setting one id disables every other
# check while reading like you enabled something. `skip-check:` is the
# additive one.

skip-check: []
