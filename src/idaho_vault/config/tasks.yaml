who_inquiry_task:
  description: >
    For the authorized topic {topic}, identify the entities, roles, standing,
    and unresolved identity questions. Cite only evidence available within the
    authorized source set and distinguish facts from uncertainty.
  expected_output: >
    A WHO lane packet containing an identity ledger, evidence references,
    unresolved identities, and confidence-qualified findings.
  agent: who_wizard

what_inquiry_task:
  description: >
    For the authorized topic {topic}, identify the relevant events, artifacts,
    claims, and changes. Separate direct evidence from inference and state what
    remains unestablished.
  expected_output: >
    A WHAT lane packet containing an artifact/event ledger, evidence references,
    claim boundaries, and confidence-qualified findings.
  agent: what_wizard

when_inquiry_task:
  description: >
    For the authorized topic {topic}, establish the event sequence, dates,
    version order, and temporal uncertainties. Preserve conflicts rather than
    inventing a clean chronology.
  expected_output: >
    A WHEN lane packet containing a timeline, evidence references, temporal
    conflicts, and confidence-qualified findings.
  agent: when_wizard

where_inquiry_task:
  description: >
    For the authorized topic {topic}, identify relevant repository paths,
    systems, jurisdictions, and physical or digital locations. Mark every
    location ambiguity explicitly.
  expected_output: >
    A WHERE lane packet containing a location/jurisdiction map, evidence
    references, scope boundaries, and confidence-qualified findings.
  agent: where_wizard

why_inquiry_task:
  description: >
    For the authorized topic {topic}, identify stated rationales, evidence-based
    significance, and unsupported motive claims. Do not infer intent beyond the
    authorized evidence.
  expected_output: >
    A WHY lane packet containing a rationale ledger, evidence references,
    objections, and confidence-qualified findings.
  agent: why_wizard

council_synthesis_task:
  description: >
    Review the five prior lane packets for the authorized topic {topic}. Identify
    cross-lane contradictions, preserve unresolved objections, and prepare a
    bounded staged recommendation. Do not claim canonical authority, expand the
    source set, or self-authorize promotion.
  expected_output: >
    A HOW council packet containing cross-lane tensions, unresolved questions,
    a bounded synthesis recommendation, and an explicit staged disposition for
    human review.
  agent: how_wizard
