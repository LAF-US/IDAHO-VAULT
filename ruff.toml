# Ruff — Codacy toggle. Standalone rather than a [tool.ruff] table in
# pyproject.toml. If both ever exist, THIS FILE WINS and the table is ignored
# silently; pick one.

target-version = "py310"

[lint]
# Ruff's own default set, written out so it can be read without knowing the
# defaults. Measured on this repo at ruff 0.15.8:
#
#   ["E4","E7","E9","F"]  ->    61 findings,  8 in live code
#   ["E","F"]             -> 1,368 findings, 785 in live code
#
# The 1,307 difference is E501 line-too-long alone — thirteen hundred
# complaints about line width, in a repo that runs no Python formatter, on top
# of eight real defects.
#
# Nothing is excluded. The 53 findings outside live code sit in root-level
# flattened NETWEB alias copies and two unparseable notebooks; excluding them
# would tune the linter to the mess. Ruff's built-in excludes already cover
# .venv and node_modules — verified identical counts with and without.
select = ["E4", "E7", "E9", "F"]

# No `ignore`. Silence at the line (`# noqa: F401 - re-export`), where the
# exemption keeps its reason.
