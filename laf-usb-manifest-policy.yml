name: LAF-USB Manifest Policy

on:
  pull_request:
    paths:
      - "LAF-USB-OBJECT-MANIFEST*.json"
      - ".github/scripts/laf_usb_manifest.py"
      - ".github/workflows/laf-usb-manifest-policy.yml"
  push:
    branches:
      - main
    paths:
      - "LAF-USB-OBJECT-MANIFEST*.json"
      - ".github/scripts/laf_usb_manifest.py"
      - ".github/workflows/laf-usb-manifest-policy.yml"

# Supersede, don't stack: a newer run for the same branch replaces the still-running
# one, which nobody is waiting on. This check reads the manifest as it stands rather
# than a per-push delta, so the replacement run sees everything the cancelled one would.
#
# `github.event_name` is in the group key on purpose: it keeps push-event and
# pull_request-event runs of one branch in SEPARATE groups, so a push run cannot
# cancel a required PR check. This workflow has no merge_group trigger.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Validate LAF-USB manifests
        run: |
          shopt -s nullglob
          manifests=(LAF-USB-OBJECT-MANIFEST*.json)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No LAF-USB object manifests found."
            exit 0
          fi
          python .github/scripts/laf_usb_manifest.py "${manifests[@]}"
