# Actions reads only that directory, so nothing under `on:` below can fire from
# here. Position is the switch; editing the triggers while the file is here
# changes nothing.
#
# Parked because no one asked for this check. Unlike the other five parked
# alongside it, this one was never swept by 063cdaa24 ("`.github` cleaned",
# 2026-08-21) — it postdates the sweep and was simply never subjected to it. It
# calls scripts_scripts/phone_link_intake.py through a stale .github/scripts/
# path, so it has been failing rather than measuring anything. A red check is
# not a request. Do not move this file back without Logan saying so.

name: Code Coverage

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    # Repository secrets are not exposed to pull requests from forks. Skipping
    # the upload in that context prevents an untrusted workflow change from
    # accessing the Codacy project token.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install coverage reporter
        run: python -m pip install --disable-pip-version-check coverage

      - name: Run the tested Phone Link contract under coverage
        run: |
          python -m coverage run \
            --branch \
            --include='.github/scripts/phone_link_auto_sweep.py,scripts_scripts/phone_link_intake.py' \
            -m unittest tests/test_phone_link_contract.py -v
          python -m coverage xml --skip-empty -o coverage.xml

      - name: Upload Cobertura coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml
          language: Python
          force-coverage-parser: cobertura
