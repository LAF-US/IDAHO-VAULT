# Semgrep — Codacy toggle.
#
# The `semgrep-cloud-platform/scan` check runs on every PR and does NOT read
# this file; it pulls its ruleset from the Semgrep platform. Codacy's semgrep
# and a bare `semgrep scan` do read it. Rules added here therefore do not
# tighten the PR gate.
#
# Semgrep has no `extends` — a rules file holds literal rules, so there is no
# baseline to reference. These three target what this repo actually does.
#
# Semgrep is not installed in the environment this was written in, so these
# were not run here. They HAVE been validated elsewhere: CodeRabbit ran
# `semgrep scan --validate --config .semgrep.yaml` against them on #950 and
# the ruleset loaded. Every PyYAML name below was checked against the
# installed module — all eight *_load / *_load_all forms exist.

rules:
  - id: subprocess-shell-true
    languages: [python]
    severity: WARNING
    message: >-
      shell=True hands the command to a shell, so any interpolated value
      becomes executable syntax. Pass a list of arguments instead.
    pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: yaml-load-without-safe-loader
    languages: [python]
    severity: ERROR
    message: >-
      yaml.load() can construct arbitrary Python objects, so parsing an
      untrusted file is code execution. Use yaml.safe_load().
    # Enumerated per loader rather than matched broadly, because a blanket
    # `yaml.load_all(...)` would also flag SafeLoader, which is the correct
    # call. CLoader is the libyaml build of the unsafe Loader, not a safe one.
    pattern-either:
      - pattern: yaml.load($DATA)
      - pattern: yaml.load($DATA, Loader=yaml.Loader)
      - pattern: yaml.load($DATA, Loader=yaml.UnsafeLoader)
      - pattern: yaml.load($DATA, Loader=yaml.FullLoader)
      - pattern: yaml.load($DATA, Loader=yaml.CLoader)
      - pattern: yaml.unsafe_load($DATA)
      - pattern: yaml.full_load($DATA)
      - pattern: yaml.load_all($DATA)
      - pattern: yaml.load_all($DATA, Loader=yaml.Loader)
      - pattern: yaml.load_all($DATA, Loader=yaml.UnsafeLoader)
      - pattern: yaml.load_all($DATA, Loader=yaml.CLoader)
      - pattern: yaml.unsafe_load_all($DATA)
      - pattern: yaml.full_load_all($DATA)

  - id: os-system-call
    languages: [python]
    severity: WARNING
    message: >-
      os.system() runs its argument through a shell, so any interpolated value
      becomes executable syntax, and it gives back only a wait status — stdout
      and stderr go straight to the parent's streams and cannot be captured or
      inspected. Use subprocess.run with a list of arguments.
    pattern: os.system(...)
