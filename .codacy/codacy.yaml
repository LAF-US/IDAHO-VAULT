---
# Tool set for Codacy CLI v2 (.github/workflows/codacy.yml).
#
# This is NOT the same file as the repository-root .codacy.yaml. That one is
# Codacy Cloud's configuration — exclusions, languages, per-engine settings,
# read from the default branch by the hosted analyser. This one is the local
# CLI's runtime manifest: which language runtimes to install and which tool
# versions to run. Both are needed; neither substitutes for the other.
#
# eslint 8.57.0 is pinned to match the version Codacy Cloud runs, which is the
# reason .eslintrc.js is kept in this repository at all: ESLint 8 reads
# .eslintrc.js, ESLint 9+ reads eslint.config.js and would ignore it. Measured
# on this repository: `codacy-cli analyze --format sarif` with this config
# produced 13,284 results across 47 files and exited 0.
runtimes:
    - node@22.2.0
tools:
    - eslint@8.57.0
