[project]
name = "idaho-vault"
version = "0.1.0"
description = "CrewAI deployment-validation shard for IDAHO-VAULT"
authors = [{ name = "Logan Finney" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.9.3,<2",
    "flask>=3.0.0,<4",
    "pydantic~=2.11.9",
    "huggingface-hub>=0.0,<2",
    "requests-oauthlib>=0.0,<3",
    "honcho-ai>=2.1.2,<3",
]

[project.scripts]
idaho_vault = "idaho_vault.main:run"
run_crew = "idaho_vault.main:run"
train = "idaho_vault.main:train"
replay = "idaho_vault.main:replay"
test = "idaho_vault.main:test"
run_with_trigger = "idaho_vault.main:run_with_trigger"
five_wizards_threshold = "idaho_vault.main:run_five_wizards_threshold"
civic_scaffold = "idaho_vault.main:run_civic_scaffold"
metadata_survey = "idaho_vault.main:run_metadata_survey"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idaho_vault"]

[tool.uv]
cache-dir = ".uv-cache"
python-downloads = "manual"
python-preference = "system"
override-dependencies = [
    "mcp>=1.27.2",
]

[tool.crewai]
type = "crew"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.bandit]
# B603 (subprocess without shell=True) and B607 (partial executable path) fire
# on every git/gh/python invocation in this codebase's automation scripts --
# git ~40 times across ~20 files. shell=True is the actually dangerous
# alternative these rules exist to steer people away from; every call site
# uses a literal argv list (no string concatenation, no untrusted data in the
# executable name itself), and hardcoding an absolute path to `git`/`gh` would
# break portability across the Linux/macOS/Windows runners and local dev
# machines this vault runs on. Verified individually across every current
# call site before adding this (see PR #562) -- not a blanket "trust
# subprocess" exemption, just these two specific, high-false-positive rules
# for this specific literal-argv-no-shell usage pattern.
#
# B404 (import subprocess) and B405 (import xml.etree.ElementTree) are pure
# import-presence notices with no case-by-case risk judgment at all (unlike
# B603/B607 above, which were verified call site by call site). Skipping them
# globally would also silence any *future* new subprocess/ElementTree import
# added anywhere in the repo, not just the current sites -- so instead of a
# blanket skip, every current import is individually annotated with an inline
# `# nosec B404`/`# nosec B405` (see .github/scripts/*, scripts/*, etc.). New
# imports elsewhere still show up in scans. The actual xml.etree.ElementTree.
# parse() risk (B313-B320, XXE/entity expansion) is a separate rule this
# vault fixes on its merits (see build_knowledge_graph.py's _reject_doctype)
# rather than a skip.
skips = ["B603", "B607"]

[tool.bandit.assert_used]
# B101 fires on every bare `assert` -- the correct, idiomatic way to write
# pytest-style assertions -- not a security concern (Bandit's own documented
# recommendation is to skip this check for test files specifically, rather
# than exclude test directories wholesale, so other checks like hardcoded
# secrets or unsafe eval still run against test code).
skips = ["*/tests/*", "*/test_*.py"]

[tool.pytest.ini_options]
# Make the CI scripts dir an import root so test modules (which load the scripts
# by file path) can resolve the shared lib (gh_cli, etc.). Production runs the
# scripts directly, which already puts this dir on sys.path[0].
pythonpath = [".github/scripts"]

[tool.coverage.run]
# Scope measurement to this repo's own source, not third-party library internals
# pulled in incidentally by `unittest discover` importing test modules.
source = [".github/scripts", "src/idaho_vault"]
omit = ["*/test_*.py", "*/__pycache__/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15.12,<1",
    "jupytext>=1.16,<2",
    "coverage>=7.6,<8",
]
