[project]
name = "idaho-vault"
version = "0.1.0"
description = "CrewAI deployment-validation shard for IDAHO-VAULT"
authors = [{ name = "Logan Finney" }]
# HOST: macOS 12 Monterey x86_64 (Intel Mac). Dropping Intel/older macOS wheels is a
# recurring issue. Do NOT bump Python or lift constraints below without verifying wheel
# availability for this platform. See AGENTS.md for authority chain.
requires-python = ">=3.11,<3.12"
dependencies = [
    "crewai>=1.9.3",
    "flask>=3.0.0",
    "pydantic~=2.11.9",
    "huggingface-hub>=0.0",
    "requests-oauthlib>=0.0",
    "lancedb<0.26",
    "honcho-ai>=2.1.2",
]

[project.scripts]
idaho_vault = "idaho_vault.main:run"
run_crew = "idaho_vault.main:run"
train = "idaho_vault.main:train"
replay = "idaho_vault.main:replay"
test = "idaho_vault.main:test"
run_with_trigger = "idaho_vault.main:run_with_trigger"
five_wizards_threshold = "idaho_vault.main:run_five_wizards_threshold"
civic_scaffold = "idaho_vault.main:run_civic_scaffold"
metadata_survey = "idaho_vault.main:run_metadata_survey"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idaho_vault"]

[tool.uv]
cache-dir = ".uv-cache"
python-downloads = "manual"
python-preference = "system"
constraint-dependencies = [
    "onnxruntime<1.17",
]

[tool.crewai]
type = "crew"

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
