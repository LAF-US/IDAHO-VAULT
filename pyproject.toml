[project]
name = "idaho-vault"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "flask>=3.1.0",
  "pygit2>=1.18.2",
  "pyyaml>=6.0.3",
  "posthog>=7.38.4,<8",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-codspeed>=5.0.3",
]


[project.urls]
Repository = "https://github.com/LAF-US/IDAHO-VAULT"

[tool.pytest.ini_options]
# Root-level test modules use two prefixes: plain `test_*.py` (e.g.
# test_doctrinal_flatten.py) and the ten `tests-test_*.py` files -- neither
# collectible by pytest's own default (`test_*.py`/`*_test.py`) glob for the
# second form. conftest.py's pytest_ignore_collect hook allows both at
# collection time; this makes bare `pytest` (no explicit file args) actually
# discover both instead of silently finding zero tests.
python_files = ["test_*.py", "tests-test_*.py"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
