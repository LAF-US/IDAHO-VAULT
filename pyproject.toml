[project]
name = "idaho-vault"
version = "0.1.0"
description = "CrewAI deployment-validation shard for IDAHO-VAULT"
authors = [{ name = "Logan Finney" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.9.3,<2",
    "flask>=3.0.0,<4",
    "pydantic~=2.11.9",
    "huggingface-hub>=0.0,<2",
    "requests-oauthlib>=0.0,<3",
    "honcho-ai>=2.1.2,<3",
]

[project.scripts]
idaho_vault = "idaho_vault.main:run"
run_crew = "idaho_vault.main:run"
train = "idaho_vault.main:train"
replay = "idaho_vault.main:replay"
test = "idaho_vault.main:test"
run_with_trigger = "idaho_vault.main:run_with_trigger"
five_wizards_threshold = "idaho_vault.main:run_five_wizards_threshold"
civic_scaffold = "idaho_vault.main:run_civic_scaffold"
metadata_survey = "idaho_vault.main:run_metadata_survey"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idaho_vault"]

[tool.uv]
cache-dir = ".uv-cache"
python-downloads = "manual"
python-preference = "system"
override-dependencies = [
    "mcp>=1.27.2",
]

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
# Make the CI scripts dir an import root so test modules (which load the scripts
# by file path) can resolve the shared lib (gh_cli, etc.). Production runs the
# scripts directly, which already puts this dir on sys.path[0].
pythonpath = [".github/scripts"]

[tool.coverage.run]
# Scope measurement to this repo's own source, not third-party library internals
# pulled in incidentally by `unittest discover` importing test modules.
source = [".github/scripts", "src/idaho_vault"]
omit = ["*/test_*.py", "*/__pycache__/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15.12,<1",
    "jupytext>=1.16,<2",
    "coverage>=7.6,<8",
]
