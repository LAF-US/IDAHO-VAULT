[project]
name = "idaho-vault"
version = "0.1.0"
description = "The world is quiet here．Esto Perpetua!"
authors = [{ name = "Logan Finney" }, { name = "Unified Swarm" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.9.3,<2",
    "flask>=3.0.0,<4",
    "pydantic~=2.11.9",
    "pygit2>=1.18.2,<2",
    "huggingface-hub>=0.0,<2",
    "requests-oauthlib>=0.0,<3",
    "honcho-ai>=2.1.2,<3",
    # Kept exactly as you left it. No tracked source imports `packaging`
    # (`git grep` finds 0), so it is not load-bearing -- but it is your line and
    # nothing in the evidence required removing it.
    "packaging",
]

# Required verbatim by src/idaho_vault/bootstrap_contract.py:78, which fails the
# threshold prereflight without the exact token
# `idaho_vault = "idaho_vault.main:run"`. The other eight entries this file used
# to carry (run_crew, train, replay, test, run_with_trigger,
# five_wizards_threshold, civic_scaffold, metadata_survey) are named by no
# contract and no test; the suite is green without them.
[project.scripts]
idaho_vault = "idaho_vault.main:run"

# Five test files import `idaho_vault`, so the package has to be installable.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idaho_vault"]

# Required verbatim by bootstrap_contract.py:77 (the token `type = "crew"`).
[tool.crewai]
type = "crew"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "coverage>=7.6,<8",
    # ruff and jupytext are imported by nothing, but
    # tests/test_uv_dependency_submission.py asserts ruff is in the resolved set
    # and pins the resolved count at 164.
    "ruff>=0.15.12,<1",
    "jupytext>=1.16,<2",
]

[tool.pytest.ini_options]
# Makes the CI scripts dir an import root so test modules (which load the scripts
# by file path) can resolve the shared lib (gh_cli, etc.). Production runs the
# scripts directly, which already puts this dir on sys.path[0].
pythonpath = [".github/scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"
# uv.lock is TOML, not Python. No test covers this, so the evidence is a CI run:
# Codacy's Ruff integration passes the file's path explicitly, and Ruff ignores
# exclude patterns for explicitly-passed paths unless force-exclude is set --
# without these two lines, PR #891 run 91770995487 raised 152 bogus
# "invalid-syntax" alerts.
extend-exclude = ["uv.lock"]
force-exclude = true

[tool.coverage.run]
# Also uncovered by any test. Without it, coverage measures third-party library
# internals pulled in incidentally when test modules import them, and the
# reported percentage moves for reasons that have nothing to do with this repo.
source = [".github/scripts", "src/idaho_vault"]
omit = ["*/test_*.py", "*/__pycache__/*"]

