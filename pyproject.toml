[project]
name = "idaho-vault"
version = "0.1.0"
description = "CrewAI deployment-validation shard for IDAHO-VAULT"
authors = [{ name = "Logan Finney" }, { name = "Unified Swarm" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.9.3,<2",
    "flask>=3.0.0,<4",
    "pydantic~=2.11.9",
    "huggingface-hub>=1.24.0,<2",
    "requests-oauthlib>=2.0.0,<3",
    "honcho-ai>=2.1.2,<3",
    "pygit2>=1.18.2,<2",
]

[project.scripts]
idaho_vault = "idaho_vault.main:run"
run_crew = "idaho_vault.main:run"
train = "idaho_vault.main:train"
replay = "idaho_vault.main:replay"
test = "idaho_vault.main:test"
run_with_trigger = "idaho_vault.main:run_with_trigger"
five_wizards_threshold = "idaho_vault.main:run_five_wizards_threshold"
civic_scaffold = "idaho_vault.main:run_civic_scaffold"
metadata_survey = "idaho_vault.main:run_metadata_survey"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idaho_vault"]

[tool.uv]
cache-dir = ".uv-cache"
python-downloads = "manual"
python-preference = "system"
override-dependencies = [
    "mcp>=1.27.2",
]

[tool.crewai]
type = "crew"

[tool.ruff]
line-length = 100
target-version = "py310"
# uv.lock is TOML, not Python. Ruff's normal *.py extension-based file
# discovery already skips it when run as `ruff check .` -- this exists
# because some callers (verified: Codacy's Ruff integration, PR #891 run
# 91770995487, 152 bogus "invalid-syntax" alerts) invoke Ruff with the
# file's path passed explicitly, and Ruff's own documented behavior is to
# ignore its exclude patterns for explicitly-passed paths unless
# force-exclude is set. This teaches Ruff itself, so it's correct for any
# invocation -- Codacy's, CI's, or a developer's local `ruff check <path>`
# -- not just a review-platform-level exclusion of the alert.
extend-exclude = ["uv.lock"]
force-exclude = true

[tool.pytest.ini_options]
# Make the CI scripts dir an import root so test modules (which load the scripts
# by file path) can resolve the shared lib (gh_cli, etc.). Production runs the
# scripts directly, which already puts this dir on sys.path[0].
pythonpath = [".github/scripts"]

[tool.coverage.run]
# Scope measurement to this repo's own source, not third-party library internals
# pulled in incidentally by `unittest discover` importing test modules.
source = [".github/scripts", "src/idaho_vault"]
omit = ["*/test_*.py", "*/__pycache__/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15.12,<1",
    "jupytext>=1.16,<2",
    "coverage>=7.6,<8",
]
