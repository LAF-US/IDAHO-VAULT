[project]
name = "idaho-vault"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "crewai>=1.9.3,<2",
    "flask>=3.0.0,<4",
    "pydantic~=2.11.9",
    "huggingface-hub>=0.0,<2",
    "requests-oauthlib>=0.0,<3",
    "honcho-ai>=2.1.2,<3",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-codspeed>=5.0.3",
]


[project.urls]
Repository = "https://github.com/LAF-US/IDAHO-VAULT"

[tool.pytest.ini_options]
# Root-level test modules use two prefixes: plain `test_*.py` (e.g.
# test_doctrinal_flatten.py) and the ten `tests-test_*.py` files -- neither
# collectible by pytest's own default (`test_*.py`/`*_test.py`) glob for the
# second form. conftest.py's pytest_ignore_collect hook allows both at
# collection time; this makes bare `pytest` (no explicit file args) actually
# discover both instead of silently finding zero tests.
python_files = ["test_*.py", "tests-test_*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idaho_vault"]

[tool.uv]
cache-dir = ".uv-cache"
python-downloads = "manual"
python-preference = "system"
override-dependencies = [
    "mcp>=1.27.2",
]

[tool.crewai]
type = "crew"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
# Make the CI scripts dir an import root so test modules (which load the scripts
# by file path) can resolve the shared lib (gh_cli, etc.). Production runs the
# scripts directly, which already puts this dir on sys.path[0].
pythonpath = [".github/scripts"]

[tool.coverage.run]
# Scope measurement to this repo's own source, not third-party library internals
# pulled in incidentally by `unittest discover` importing test modules.
source = [".github/scripts", "src/idaho_vault"]
omit = ["*/test_*.py", "*/__pycache__/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15.12,<1",
    "jupytext>=1.16,<2",
    "coverage>=7.6,<8",
]
