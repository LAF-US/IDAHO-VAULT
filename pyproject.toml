[project]
name = "idaho-vault"
version = "0.1.0"
description = "The world is quiet here．Esto Perpetua!"
authors = [{ name = "Logan Finney" }, { name = "Unified Swarm" }]
# Without this, uv resolves against its own default of >=3.13 — which silently
# drops every 3.10 resolution from uv.lock while smoke-tests.yml still runs the
# suite on 3.10. Measured: removing it collapsed pygit2 from two version-split
# entries (1.18.2 for 3.10, 1.19.3 for 3.11+) to one, and left the lock claiming
# 3.13-only for a project CI exercises on 3.10.
requires-python = ">=3.10,<3.14"
dependencies = [
    "packaging",
    # Each entry names a file that imports it and the run that proved it. All three
    # were smoked out by `uv run pytest tests` on e3ec9e414, which stopped with
    # "Interrupted: 6 errors during collection" and named them one at a time.
    #
    # src/idaho_vault/five_wizards/models.py:5 -> test_five_wizards,
    # test_threshold_runner, test_civic_scaffold
    "pydantic~=2.11.9",
    # .github/scripts/metadata_survey.py:28 -> test_metadata_survey;
    # tests/test_workflow_security_invariants.py:6 imports it directly.
    # NOTE: PyYAML was never declared here. It has been arriving as a transitive
    # dependency of something else, which is why nothing noticed when it stopped.
    "pyyaml>=6.0,<7",
    # tests/test_sync_obsidian_plugin_registry.py:17
    "pygit2>=1.18.2,<2",
]
# `bootstrap_contract.py:_check_pyproject` greps this file for three literal
# tokens and fails the Five Wizards threshold contract without them:
#   'name = "idaho-vault"', 'type = "crew"', 'idaho_vault = "idaho_vault.main:run"'
# The first is above; the other two are these sections. Not decoration — a
# named consumer reads them as text.
[project.scripts]
idaho_vault = "idaho_vault.main:run"

[tool.crewai]
type = "crew"

[tool.ruff]
# uv.lock is TOML, not Python. Ruff's own *.py discovery already skips it for
# `ruff check .` — this exists because some callers pass the path explicitly
# (verified: Codacy's Ruff integration, PR #891 run 91770995487, 152 bogus
# "invalid-syntax" alerts), and Ruff ignores exclude patterns for explicitly
# passed paths unless force-exclude is set. Restored here and not merely on
# precedent: this branch regenerates uv.lock, which is the condition that
# produced the #891 alert storm.
extend-exclude = ["uv.lock"]
force-exclude = true

# Just like a .gitignore file, don't fiddle with this willy-nilly.

[dependency-groups]
# Every entry names the workflow that spawns it. Nothing lives here that CI does not
# actually invoke through uv — those are the only two workflows that use uv at all.
# Deliberately NOT here: jupytext (check-notebooks-paired.yml pip-installs it at the
# version it reads out of uv.lock, never through uv) and ruff (no workflow invokes it;
# Codacy runs its own). Both were in the group before and neither was feeding anything.
dev = [
    # python-test-suite.yml -> `uv run pytest tests -v`
    "pytest>=9.0.3,<10",
    # codacy-coverage-reporter.yml -> `uv run coverage run -m pytest` / `uv run coverage xml`
    "coverage>=7.6,<8",
]
