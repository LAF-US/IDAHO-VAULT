name: Redaction Damage Policy

# Guards against recurrence of the ***REMOVED*** redaction-damage bug (#739):
# a secret-redaction tool once matched the bare sequence "rt" plus a
# separator far too broadly, stamping a literal marker over legitimate text.
# This only scans lines a diff ADDS, so it cannot retroactively fail on the
# ~237 pre-existing occurrences tracked in #739 -- it exists solely to catch
# a new instance of the same failure mode.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-redaction-damage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Checkout trusted validator code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || github.event.repository.default_branch }}
          path: trusted-main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check added lines for the redaction-damage signature
        shell: bash
        run: |
          set -eo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            base="${{ github.event.merge_group.base_sha }}"
            head="${{ github.event.merge_group.head_sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              echo "redaction-damage guard: no base to diff against (initial push) -- skipping"
              exit 0
            fi
          fi

          if [ -f trusted-main/.github/scripts/check_redaction_damage.py ]; then
            python trusted-main/.github/scripts/check_redaction_damage.py --base "$base" --head "$head"
          else
            # Bootstrap-only fallback: the checker doesn't exist on the base ref
            # yet (this is the PR introducing it). Every run after this one
            # merges uses the trusted-main copy above, same as every other
            # policy check in this repo.
            echo "::warning::check_redaction_damage.py absent from base ref; using this PR's own copy (bootstrap only)"
            python .github/scripts/check_redaction_damage.py --base "$base" --head "$head"
          fi
